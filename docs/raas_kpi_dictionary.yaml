  description: "전월 1개월간 1분 이상 청취자 중 10분 이상까지 청취한 비율. 월 단위 콘텐츠 몰입도."
  example: 60.2

deep_rate_mon_prev:
  label_ko: "월간 깊은청취율 (지지난달값)"
  label_en: "Monthly Deep Listening Rate 1 Month Prior"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 지지난달 1일
  window: "1mon_calendar"
  description: "지지난달의 월간 깊은청취율. deep_rate_mon_diff 계산의 기준값."
