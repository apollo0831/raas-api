  category: user_retention
  type: pp
  unit: pp
  formula: |
    한국어: D1 유지율 - 7일 전 D1 유지율
    SPL:   d1_ret - d1_ret_prev
  description: "D-1 vs D-8의 D1 유지율 차이(pp)."
  example: 0.8
  note: "이전 이름: d1_diff"

