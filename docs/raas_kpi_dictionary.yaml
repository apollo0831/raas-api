  unit: "%"
  formula: |
    한국어: (전월 신규 - 지지난달 신규) / 지지난달 신규 × 100
    SPL:   (new_mon - new_mon_prev) / new_mon_prev * 100
  description: "전월 vs 지지난달 신규 사용자 변동률. 월 단위 신규 유입 트렌드."
  example: 3.5
  note: |
    이전 이름: new_mon_wow.
    의미상 MoM이지만 명명은 _chg로 통일.

