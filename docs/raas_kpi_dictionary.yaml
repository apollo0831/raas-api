# ─────────────────────────────────────────────────────────────────────────────
# Category E. Reactivated Users (복귀 사용자) — Absolute Counts
# 휴면 상태에서 다시 앱을 활성화한 사용자 — 일간/주간/월간
#
# 카테고리 분리:
#   - E (이번): react/react_week/react_mon — 복귀 사용자 수 (절대값)
#   - F (다음): react_rate/react_rate_week/react_rate_mon — 복귀율 (휴면 대비 %)
#
# 베이스 명명:
#   - react      : 일간 (D-1)
#   - react_week : 주간 일반 (전주 누적)
#   - react_mon  : 월간 일반 (전월 누적)
#
# 각 기간마다 4종 필드 세트 (D 카테고리와 동일 패턴):
#   - 절대값       : react, react_week, react_mon
#   - 비교 기준값   : react_prev, react_week_prev, react_mon_prev
#   - 변동률(%)    : react_chg, react_week_chg, react_mon_chg
#   - DAU 대비 비율 : react_share, react_week_share, react_mon_share
# ─────────────────────────────────────────────────────────────────────────────

# E-1. Daily Reactivated Users

react:
  label_ko: "일간 복귀 사용자"
  label_en: "Daily Reactivated Users"
  category: user_growth
  type: count
  unit: 명
  reference_date: D-1
  window: 1d
  source: "program_reactuser_funnel_day.csv (TYPE=ALL, PERIOD=1D)"
  related:
    prev: react_prev
    chg: react_chg
    share: react_share
    rate: react_rate
  description: "전일(D-1) 24시간 동안 휴면 상태에서 다시 앱을 활성화한 순 사용자 수. 휴면 풀에서의 복귀 규모."
