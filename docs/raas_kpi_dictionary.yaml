  example: 49500
  note: "이전 이름: new_week_pw"

new_week_chg:
  label_ko: "주간 신규 전주 대비 증감률"
  label_en: "Weekly New Users WoW Change"
  category: user_growth
  type: pct
  unit: "%"
  formula: |
    한국어: (전주 신규 - 지지난주 신규) / 지지난주 신규 × 100
    SPL:   (new_week - new_week_prev) / new_week_prev * 100
  description: "전주 vs 지지난주 신규 사용자 변동률."
  example: 5.7
  note: "이전 이름: new_week_wow"

new_week_share:
  label_ko: "주간 신규 비중 (WAU 대비)"
