# ============================================================================
# RAAS KPI Metadata Dictionary
# ============================================================================
# Version: 1.0
# Updated: 2026-04-29
# Lookup:  raas_kpi_latest.csv
# Owner:   SBS RAAS Team
#
# Purpose:
#   - 룩업 CSV의 모든 필드에 대한 단일 신뢰 출처 (Single Source of Truth)
#   - 향후 온톨로지(RDF/OWL) 변환의 기초 자료
#   - AI 분석 시스템의 컨텍스트 자료
#   - 신규 입사자 교육 및 외부 협업 시 표준 참조 문서
#
# Naming Rule:
#   {indicator}_{aggregation}_{comparison}
#
#   indicator:    dau/wau/mau, new, react, churn_rate, engage_rate,
#                 habit_rate, deep_rate, d1_ret/d7_ret/w1_ret/m1_ret,
#                 new_d1_ret 등
#   aggregation:  (none)=current / week / mon / r7 / r30
#   comparison:   (none)=current value / _prev / _chg(%) / _diff(pp) /
#                 _share(of DAU) / _avg
#
# Categories:
#   - meta            : 식별/날짜/편성 정보
#   - user_size       : 사용자 규모 (DAU/WAU/MAU + 1분/10분)
#   - user_growth     : 신규/복귀 사용자 절대값
#   - user_quality    : 복귀율/이탈율/깊은청취율/참여율
#   - user_habit      : 습관형성률 (신규 코호트 정착)
#   - user_retention  : 유지율 (전체/신규 코호트)
#
# _prev Definition Rule (per window):
#   - 1d window     (DAU):     D-8  (요일 효과 통제 위해 7일 전)
#   - 7d window     (WAU/r7):  D-8 또는 지지난주 (1주 전)
#   - 30d window    (MAU/r30): D-31 또는 지지난달 (1달 전)
#
# Type Codes:
#   count : 정수 카운트 (명)
#   rate  : 비율 (%)
#   pct   : 변동률 (%, _chg 필드)
#   pp    : 차이 (percentage point, _diff 필드)
#   date  : 날짜
#   string: 문자열
# ============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# Category A. Metadata & Date Fields
# 룩업 행을 식별하고 시점을 명시하는 비-KPI 필드
# ─────────────────────────────────────────────────────────────────────────────

DATE:
  label_ko: "일간 기준일"
  label_en: "Reference Date (Daily)"
  category: meta
  type: date
  unit: "YYYY/MM/DD"
  reference_date: D-1
  description: "이 행이 보고하는 일간 지표의 기준일. 자정 이후 배치가 도는 다음날 기준이므로 실제로는 D-1(전일)을 가리킴."
  example: "2026/04/28"

DATE_WEEK:
  label_ko: "주간 기준일 (전주 월요일)"
  label_en: "Reference Date (Weekly)"
  category: meta
  type: date
  unit: "YYYY/MM/DD"
  reference_date: 전주 월요일
  description: "주간 지표가 집계한 '전주(Mon~Sun)'의 시작일."
  example: "2026/04/21"

DATE_MON:
  label_ko: "월간 기준일 (전월 1일)"
  label_en: "Reference Date (Monthly)"
  category: meta
  type: date
  unit: "YYYY/MM/DD"
  reference_date: 전월 1일
  description: "월간 지표가 집계한 '전월(1일~말일)'의 시작일."
  example: "2026/03/01"

PGM_CODE:
  label_ko: "프로그램 코드"
  label_en: "Program Code"
  category: meta
  type: string
  unit: "3자리 코드"
  description: "프로그램/채널/전체를 식별하는 3자리 코드. 코드별 명칭 매핑은 raas_briefing_engine.py의 PGM_NAMES를 단일 출처로 함."
  example: "F09"
  values_total: 41
  excluded: ["L04"]

PGM_NAME:
  label_ko: "프로그램명"
  label_en: "Program Name"
  category: meta
  type: string
  source: BROADPLAN.csv
  description: "PGM_CODE에 매핑되는 프로그램의 정식 명칭."
  example: "두시탈출 컬투쇼"
  note: "채널 단위(T00/F00/L00/G00/P00)는 비어있을 수 있음"

STIME:
  label_ko: "방송 시작 시간"
  label_en: "Broadcast Start Time"
  category: meta
  type: string
  unit: "HH:MM"
  source: BROADPLAN.csv
  description: "프로그램의 정규 편성 시작 시간."
  example: "14:00"

program_title:
  label_ko: "당일 방송 제목"
  label_en: "Episode Title"
  category: meta
  type: string
  source: index=broadplan
  description: "DATE 당일 실제 방송된 회차의 제목. 정식 프로그램명(PGM_NAME)과 별개로 그날 회차/특집/주제."
  example: "게스트 박나래 출연 - 봄 특집"
  note: "이전 이름: schedule_title"

guestname:
  label_ko: "게스트명"
  label_en: "Guest Name"
  category: meta
  type: string
  source: index=broadplan
  description: "DATE 당일 출연 게스트. 다중 게스트 시 멀티밸류."
  example: "박나래"

daily_corner:
  label_ko: "당일 일일 코너"
  label_en: "Daily Corner"
  category: meta
  type: string
  source: index=broadplan
  description: "DATE 당일 진행된 일일 코너 정보."

weekly_corner:
  label_ko: "당일 주간 코너"
  label_en: "Weekly Corner"
  category: meta
  type: string
  source: index=broadplan
  description: "DATE 당일 진행된 주간 코너 정보."


# ─────────────────────────────────────────────────────────────────────────────
# Category B. User Size (사용자 규모)
# 활성 사용자 수 — 일간/주간/월간 + 롤링 7일/30일
#
# 일반(absolute window) vs 롤링(rolling window) 구분:
#   - 일반: 달력 기준 완료된 기간 (전일/전주/전월)
#   - 롤링: D-1 시점 기준 N일 윈도우 (매일 갱신)
#
# 같은 7일을 보더라도:
#   - wau    = 전주 월~일 7일간 1회 이상 활성한 순 사용자
#   - dau_r7 = D-1부터 거꾸로 7일간 1회 이상 활성한 순 사용자
# ─────────────────────────────────────────────────────────────────────────────

# B-1. Daily (DAU)

dau:
  label_ko: "일간 활성 사용자"
  label_en: "Daily Active Users"
  category: user_size
  type: count
  unit: 명
  reference_date: D-1
  window: 1d
  source: "program_user_funnel_day.csv (TYPE=ALL, PERIOD=1D)"
  related:
    prev: dau_prev
    chg: dau_chg
    d2: dau_d2
  description: "전일(D-1) 24시간 동안 1회 이상 앱을 활성화한 순 사용자 수."
  example: 123456
  note: "이전 이름: dau_today"

dau_prev:
  label_ko: "DAU (D-8 비교값)"
  label_en: "DAU 7-day Prior"
  category: user_size
  type: count
  unit: 명
  reference_date: D-8
  window: 1d
  description: "전주 동요일(D-8)의 DAU. dau_chg 계산의 기준값."
  example: 121000
  note: "이전 이름: dau_pw"

dau_chg:
  label_ko: "DAU 전주 대비 증감률"
  label_en: "DAU WoW Change"
  category: user_size
  type: pct
  unit: "%"
  formula: |
    한국어: (당일 DAU - 7일 전 DAU) / 7일 전 DAU × 100
    SPL:   (dau - dau_prev) / dau_prev * 100
  description: "D-1 vs D-8의 DAU 변동률. 요일 효과를 통제한 주간 단위 비교."
  example: 2.0
  note: "이전 이름: dau_wow"

dau_d2:
  label_ko: "DAU (D-2 어제값)"
  label_en: "DAU 2 days ago"
  category: user_size
  type: count
  unit: 명
  reference_date: D-2
  window: 1d
  description: "전전일(D-2)의 DAU. 사용자 흐름 분석에서 직전 활성 기준 계산용."
  example: 119500
  note: "이전 이름: dau_yday"

# B-2. Weekly (WAU = 전주 누적, 일반)

wau:
  label_ko: "주간 활성 사용자 (전주 누적)"
  label_en: "Weekly Active Users"
  category: user_size
  type: count
  unit: 명
  reference_date: 전주 월요일
  window: "7d_calendar (Mon-Sun)"
  source: "program_user_funnel_week.csv (TYPE=ALL, PERIOD=1W)"
  related:
    prev: wau_prev
    chg: wau_chg
  description: "전주 월요일~일요일 7일간 1회 이상 활성한 순 사용자 수. 달력 기준 완료된 한 주."
  example: 445678
  note: "이전 이름: dau_week. WAU(Weekly Active Users) 표준 명칭으로 변경."

wau_prev:
  label_ko: "WAU (지지난주값)"
  label_en: "WAU 1 Week Prior"
  category: user_size
  type: count
  unit: 명
  reference_date: 지지난주 월요일
  window: "7d_calendar"
  description: "지지난주 월~일의 WAU. wau_chg 계산의 기준값."
  example: 423000
  note: "이전 이름: dau_week_pw"

wau_chg:
  label_ko: "WAU 전주 대비 증감률"
  label_en: "WAU WoW Change"
  category: user_size
  type: pct
  unit: "%"
  formula: |
    한국어: (전주 WAU - 지지난주 WAU) / 지지난주 WAU × 100
    SPL:   (wau - wau_prev) / wau_prev * 100
  description: "전주 vs 지지난주 WAU 변동률."
  example: 5.4
  note: "이전 이름: dau_week_wow"

# B-3. Monthly (MAU = 전월 누적, 일반)

mau:
  label_ko: "월간 활성 사용자 (전월 누적)"
  label_en: "Monthly Active Users"
  category: user_size
  type: count
  unit: 명
  reference_date: 전월 1일
  window: "1mon_calendar (1st-last day)"
  source: "program_user_funnel_mon.csv (TYPE=ALL, PERIOD=1M)"
  related:
    prev: mau_prev
    chg: mau_chg
  description: "전월 1일~말일 1개월 동안 1회 이상 활성한 순 사용자 수. 달력 기준 완료된 한 달."
  example: 1756234
  note: "이전 이름: dau_mon. MAU(Monthly Active Users) 표준 명칭으로 변경."

mau_prev:
  label_ko: "MAU (지지난달값)"
  label_en: "MAU 1 Month Prior"
  category: user_size
  type: count
  unit: 명
  reference_date: 지지난달 1일
  window: "1mon_calendar"
  description: "지지난달 1일~말일의 MAU. mau_chg 계산의 기준값."
  example: 1725000
  note: "이전 이름: dau_mon_pw"

mau_chg:
  label_ko: "MAU 전월 대비 증감률"
  label_en: "MAU MoM Change"
  category: user_size
  type: pct
  unit: "%"
  formula: |
    한국어: (전월 MAU - 지지난달 MAU) / 지지난달 MAU × 100
    SPL:   (mau - mau_prev) / mau_prev * 100
  description: "전월 vs 지지난달 MAU 변동률. 의미상 MoM이지만 지표명은 _chg로 통일."
  example: 1.8
  note: "이전 이름: dau_mon_wow"

# B-4. Rolling 7-day

dau_r7:
  label_ko: "롤링 7일 활성 사용자"
  label_en: "Rolling 7-day Active Users"
  category: user_size
  type: count
  unit: 명
  reference_date: D-1
  window: 7d_rolling
  source: "program_user_funnel_day.csv (TYPE=ALL, PERIOD=7D)"
  related:
    prev: dau_r7_prev
    chg: dau_r7_chg
  description: "D-1 시점 기준 직전 7일간 1회 이상 활성한 순 사용자 수. 매일 새로 계산되며 일반 WAU와 달리 주가 끝나기를 기다리지 않고 추세 변화를 즉시 포착."
  example: 523456
  note: |
    이전 이름: wau_today.
    DAU의 7일 윈도우 확장으로 보고 dau_r7로 명명.
    일반 WAU(전주 누적)와 의미가 다르므로 혼동 주의.

dau_r7_prev:
  label_ko: "롤링 7일 (D-8 비교값)"
  label_en: "Rolling 7-day Active Users 8 days Prior"
  category: user_size
  type: count
  unit: 명
  reference_date: D-8
  window: 7d_rolling
  description: |
    D-8 시점 기준 직전 7일간 활성 사용자 수. dau_r7_chg 계산의 기준값.
    두 7일 윈도우(D-7~D-1, D-14~D-8)는 사실상 분리되어 있어 WoW 비교에 적합.
  example: 510000
  note: "이전 이름: wau_pw"

dau_r7_chg:
  label_ko: "롤링 7일 전주 대비 증감률"
  label_en: "Rolling 7-day WoW Change"
  category: user_size
  type: pct
  unit: "%"
  formula: |
    한국어: (D-1 기준 롤링 7일 - D-8 기준 롤링 7일) / D-8 기준 롤링 7일 × 100
    SPL:   (dau_r7 - dau_r7_prev) / dau_r7_prev * 100
  description: "D-1 기준 롤링 7일 vs D-8 기준 롤링 7일 변동률. 실질적 WoW 의미."
  example: 2.6
  status: NEW
  note: "신규 추가 필드."

# B-5. Rolling 30-day

dau_r30:
  label_ko: "롤링 30일 활성 사용자"
  label_en: "Rolling 30-day Active Users"
  category: user_size
  type: count
  unit: 명
  reference_date: D-1
  window: 30d_rolling
  source: "program_user_funnel_day.csv (TYPE=ALL, PERIOD=30D)"
  related:
    prev: dau_r30_prev
    chg: dau_r30_chg
  description: "D-1 시점 기준 직전 30일간 1회 이상 활성한 순 사용자 수. 매일 갱신되는 MAU 변형."
  example: 1803456
  note: |
    이전 이름: mau_today.
    DAU의 30일 윈도우 확장으로 보고 dau_r30로 명명.
    일반 MAU(전월 누적)와 의미가 다르므로 혼동 주의.

dau_r30_prev:
  label_ko: "롤링 30일 (D-31 비교값)"
  label_en: "Rolling 30-day Active Users 30 days Prior"
  category: user_size
  type: count
  unit: 명
  reference_date: D-31
  window: 30d_rolling
  description: |
    D-31 시점 기준 직전 30일간 활성 사용자 수. dau_r30_chg 계산의 기준값.
    윈도우 길이(30일)와 비교 간격(30일)이 같아 두 윈도우가 겹치지 않음.
  example: 1750000
  note: |
    이전 이름: mau_pw (당시는 D-8 기준이었음).
    SPL 시프트 로직 변경에 따라 비교 시점을 D-8 → D-31로 변경.
    의미적 일관성을 위해 "동일 길이 윈도우의 1주기 이전" 규칙 적용.

dau_r30_chg:
  label_ko: "롤링 30일 전월 대비 증감률"
  label_en: "Rolling 30-day MoM Change"
  category: user_size
  type: pct
  unit: "%"
  formula: |
    한국어: (D-1 기준 롤링 30일 - D-31 기준 롤링 30일) / D-31 기준 롤링 30일 × 100
    SPL:   (dau_r30 - dau_r30_prev) / dau_r30_prev * 100
  description: |
    D-1 기준 롤링 30일 vs D-31 기준 롤링 30일 변동률.
    실질적 MoM 의미 (두 30일 윈도우가 겹치지 않음).
  example: 3.0
  status: NEW
  note: |
    신규 추가 필드.
    네이밍은 _chg로 통일하되 의미는 MoM(Month-over-Month).



# ─────────────────────────────────────────────────────────────────────────────
# Category C. Listening Threshold Users (1분/10분 청취 사용자)
# 깊은청취율(deep_rate) 산출의 분자/분모 데이터.
#
# deep_rate = (10분 이상 청취자 / 1분 이상 청취자) × 100
#
# 베이스 명명 규칙:
#   - dau_*  : 일간 (D-1 24시간)
#   - wau_*  : 주간 일반 (전주 누적)
#   - mau_*  : 월간 일반 (전월 누적)
#
# 1분(_1min): 광고 노출 가능 활성 사용자 (광고 단위 기본)
# 10분(_10min): 깊이 있는 청취 — 콘텐츠 몰입 사용자
# ─────────────────────────────────────────────────────────────────────────────

# C-1. Daily 1min/10min

dau_1min:
  label_ko: "일간 1분 이상 청취자"
  label_en: "Daily Active Users (1min+)"
  category: user_size
  type: count
  unit: 명
  reference_date: D-1
  window: 1d
  source: "program_user_funnel_day.csv (TYPE=1MIN, PERIOD=1D)"
  related:
    prev: dau_1min_prev
    chg: dau_1min_chg
  description: "전일(D-1) 24시간 동안 1분 이상 청취한 순 사용자 수. 깊은청취율(deep_rate) 분모이자 광고 단위 기본 활성 지표."
  example: 98765

dau_1min_prev:
  label_ko: "일간 1분 이상 청취자 (D-8 비교값)"
  label_en: "Daily 1min+ Active Users 7-day Prior"
  category: user_size
  type: count
  unit: 명
  reference_date: D-8
  window: 1d
  description: "전주 동요일(D-8)의 1분 이상 청취자 수. dau_1min_chg 및 깊은청취율 변동(deep_rate_diff) 계산용."
  example: 95000
  note: "이전 이름: dau_1min_pw"

dau_1min_chg:
  label_ko: "일간 1분 청취자 전주 대비 증감률"
  label_en: "Daily 1min+ Users WoW Change"
  category: user_size
  type: pct
  unit: "%"
  formula: |
