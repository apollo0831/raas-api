# ─────────────────────────────────────────────────────────────────────────────
# Category F. Reactivation Rate (복귀율)
# 휴면 사용자 중 다시 활성화한 비율 — 일간/주간/월간
#
# 분모 구분 (E vs F):
#   - react_share (E): 복귀자 / DAU  → 활성 사용자 중 복귀자 비중
#   - react_rate  (F): 복귀자 / 휴면풀 → 휴면 사용자 중 복귀한 비율 ★ 본 카테고리
#
# 비율 지표 표준 패턴 (3종):
#   - 현재값      : react_rate, react_rate_week, react_rate_mon
#   - 비교 기준값  : react_rate_prev, react_rate_week_prev, react_rate_mon_prev
#   - pp 차이     : react_rate_diff, react_rate_week_diff, react_rate_mon_diff
#
# 비율 지표는 % 단위라 변동을 _chg(%)가 아닌 _diff(pp)로 표기.
# ─────────────────────────────────────────────────────────────────────────────

# F-1. Daily Reactivation Rate

react_rate:
  label_ko: "일간 복귀율"
  label_en: "Daily Reactivation Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: D-1
  window: 1d
  source: "program_reactuser_funnel_day.csv ÷ program_dormant_pool_day.csv"
  formula: |
    한국어: 당일 복귀 사용자 / 당일 휴면풀 사용자 × 100
    SPL:   react / dormant_pool * 100
  related:
    prev: react_rate_prev
    diff: react_rate_diff
    count: react
    numerator: react
    denominator: "(SPL 내부) dormant_pool"
  description: "전일(D-1) 휴면 상태였던 사용자 풀 중에서 다시 활성화한 비율. 휴면 사용자 재활성화 효율 지표."
  example: 5.2
  note: |
    분모(휴면풀 사용자 수)는 룩업에 컬럼으로 저장되지 않고 SPL 내부에서 직접 사용.
    react_share(DAU 대비)와 분모가 다르므로 혼동 주의.

react_rate_prev:
  label_ko: "일간 복귀율 (D-8 비교값)"
  label_en: "Daily Reactivation Rate 7-day Prior"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: D-8
  window: 1d
  description: "전주 동요일(D-8)의 일간 복귀율. react_rate_diff 계산의 기준값."
  example: 4.9
  note: "이전 이름: react_rate_pw"

react_rate_diff:
  label_ko: "일간 복귀율 전주 대비 증감"
  label_en: "Daily Reactivation Rate WoW Difference"
  category: user_quality
  type: pp
  unit: pp
  formula: |
    한국어: 일간 복귀율 - 7일 전 일간 복귀율
    SPL:   react_rate - react_rate_prev
  description: "D-1 vs D-8의 복귀율 차이(percentage point). 휴면 재활성화 효율 변화."
  example: 0.3
  note: |
    비율 지표의 변동은 _chg(%)가 아닌 _diff(pp)로 표기.
    예: 4.9% → 5.2%면 react_rate_diff=0.3 (pp).

# F-2. Weekly Reactivation Rate (전주 누적 기준)

react_rate_week:
  label_ko: "주간 복귀율"
  label_en: "Weekly Reactivation Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 전주 월요일
  window: "7d_calendar (Mon-Sun)"
  source: "program_reactuser_funnel_week.csv ÷ program_dormant_pool_week.csv"
  formula: |
    한국어: 전주 복귀 사용자 / 전주 휴면풀 사용자 × 100
    SPL:   react_week / dormant_pool_week * 100
  related:
    prev: react_rate_week_prev
    diff: react_rate_week_diff
    count: react_week
    numerator: react_week
    denominator: "(SPL 내부) dormant_pool_week"
  description: "전주 월~일 7일간 휴면풀 사용자 중 복귀한 비율."
  example: 7.8

react_rate_week_prev:
  label_ko: "주간 복귀율 (지지난주값)"
  label_en: "Weekly Reactivation Rate 1 Week Prior"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 지지난주 월요일
  window: "7d_calendar"
  description: "지지난주 월~일의 주간 복귀율. react_rate_week_diff 계산의 기준값."
  example: 7.5
  note: "이전 이름: react_rate_week_pw"

react_rate_week_diff:
  label_ko: "주간 복귀율 전주 대비 증감"
  label_en: "Weekly Reactivation Rate WoW Difference"
  category: user_quality
  type: pp
  unit: pp
  formula: |
    한국어: 주간 복귀율 - 지지난주 주간 복귀율
    SPL:   react_rate_week - react_rate_week_prev
  description: "전주 vs 지지난주 복귀율 차이(pp)."
  example: 0.3

# F-3. Monthly Reactivation Rate (전월 누적 기준)

react_rate_mon:
  label_ko: "월간 복귀율"
  label_en: "Monthly Reactivation Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 전월 1일
  window: "1mon_calendar"
  source: "program_reactuser_funnel_mon.csv ÷ program_dormant_pool_mon.csv"
  formula: |
    한국어: 전월 복귀 사용자 / 전월 휴면풀 사용자 × 100
    SPL:   react_mon / dormant_pool_mon * 100
  related:
    prev: react_rate_mon_prev
    diff: react_rate_mon_diff
    count: react_mon
    numerator: react_mon
    denominator: "(SPL 내부) dormant_pool_mon"
  description: "전월 1일~말일 1개월간 휴면풀 사용자 중 복귀한 비율."
  example: 12.3

react_rate_mon_prev:
  label_ko: "월간 복귀율 (지지난달값)"
  label_en: "Monthly Reactivation Rate 1 Month Prior"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 지지난달 1일
  window: "1mon_calendar"
  description: "지지난달 1일~말일의 월간 복귀율. react_rate_mon_diff 계산의 기준값."
  example: 11.9
  note: "이전 이름: react_rate_mon_pw"

react_rate_mon_diff:
  label_ko: "월간 복귀율 전월 대비 증감"
  label_en: "Monthly Reactivation Rate MoM Difference"
  category: user_quality
  type: pp
  unit: pp
  formula: |
    한국어: 월간 복귀율 - 지지난달 월간 복귀율
    SPL:   react_rate_mon - react_rate_mon_prev
  description: "전월 vs 지지난달 복귀율 차이(pp). 월 단위 휴면 재활성화 효율 변화."
  example: 0.4


# ─────────────────────────────────────────────────────────────────────────────
# Category G. Churn Rate (이탈율)
# 활성 사용자 중 이탈한 비율 — 일간/주간/월간
#
# 정의 차이 주의:
#   - 일간: 이탈사용자수 / 전일 DAU × 100 (전일 활성자 중 오늘 이탈한 비율)
#   - 주간: 이탈사용자수 / 전주 WAU × 100
#   - 월간: 이탈사용자수 / 전월 MAU × 100
#
# 비율 지표 표준 패턴 (3종):
#   - 현재값      : churn_rate, churn_rate_week, churn_rate_mon
#   - 비교 기준값  : churn_rate_prev, churn_rate_week_prev, churn_rate_mon_prev
#   - pp 차이     : churn_rate_diff, churn_rate_week_diff, churn_rate_mon_diff
#
# ⚠️ 큰 변경: 기존 churn_week/churn_mon → churn_rate_week/churn_rate_mon
#    (_rate 접미사 일관 적용)
# ─────────────────────────────────────────────────────────────────────────────

# G-1. Daily Churn Rate

churn_rate:
  label_ko: "일간 이탈율"
  label_en: "Daily Churn Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: D-1
  window: 1d
  source: "program_churnuser_funnel_day.csv ÷ program_user_funnel_day.csv (전일 DAU)"
  formula: |
    한국어: 전일 이탈자 수 / 전전일 DAU × 100
    SPL:   churn_today_count / dau_d2_count * 100
  related:
    prev: churn_rate_prev
    diff: churn_rate_diff
    numerator: "(SPL 내부) churn_today_count"
    denominator: dau_d2
  description: "전일(D-1) 이탈한 사용자 수를 그 전일(D-2) DAU로 나눈 비율. 전일 활성자 중 D-1에 활성하지 않은 사용자 비율."
  example: 25.4
  note: |
    SPL 내부에서 전일 DAU(prev_DATE)와 join하여 계산.
    분모가 D-2 시점(dau_d2)이라는 점 유의.

churn_rate_prev:
  label_ko: "일간 이탈율 (D-8 비교값)"
  label_en: "Daily Churn Rate 7-day Prior"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: D-8
  window: 1d
  description: "전주 동요일(D-8)의 일간 이탈율. churn_rate_diff 계산의 기준값."
  example: 24.8
  note: "이전 이름: churn_rate_pw"

churn_rate_diff:
  label_ko: "일간 이탈율 전주 대비 증감"
  label_en: "Daily Churn Rate WoW Difference"
  category: user_quality
  type: pp
  unit: pp
  formula: |
    한국어: 일간 이탈율 - 7일 전 일간 이탈율
    SPL:   churn_rate - churn_rate_prev
  description: "D-1 vs D-8의 이탈율 차이(pp). 양수일수록 이탈 악화."
  example: 0.6
  note: "이전 이름: churn_diff"

# G-2. Weekly Churn Rate

churn_rate_week:
  label_ko: "주간 이탈율"
  label_en: "Weekly Churn Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 전주 월요일
  window: "7d_calendar (Mon-Sun)"
  source: "program_churnuser_funnel_week.csv ÷ program_user_funnel_week.csv (전주 WAU)"
  formula: |
    한국어: 전주 이탈자 수 / 지지난주 WAU × 100
    SPL:   churn_count_week / wau_prev * 100
  related:
    prev: churn_rate_week_prev
    diff: churn_rate_week_diff
    numerator: "(SPL 내부) churn_count_week"
    denominator: wau_prev
  description: "전주 7일간 이탈한 사용자 수를 지지난주 WAU로 나눈 비율."
  example: 32.1
  note: "이전 이름: churn_week. _rate 접미사 추가로 비율 지표임을 명시."

churn_rate_week_prev:
  label_ko: "주간 이탈율 (지지난주값)"
  label_en: "Weekly Churn Rate 1 Week Prior"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 지지난주 월요일
  window: "7d_calendar"
  description: "지지난주 7일간의 이탈율. churn_rate_week_diff 계산의 기준값."
  example: 31.5
  note: "이전 이름: churn_week_pw"

churn_rate_week_diff:
  label_ko: "주간 이탈율 전주 대비 증감"
  label_en: "Weekly Churn Rate WoW Difference"
  category: user_quality
  type: pp
  unit: pp
  formula: |
    한국어: 주간 이탈율 - 지지난주 주간 이탈율
    SPL:   churn_rate_week - churn_rate_week_prev
  description: "전주 vs 지지난주 이탈율 차이(pp)."
  example: 0.6
  note: "이전 이름: churn_week_diff"

# G-3. Monthly Churn Rate

churn_rate_mon:
  label_ko: "월간 이탈율"
  label_en: "Monthly Churn Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 전월 1일
  window: "1mon_calendar"
  source: "program_churnuser_funnel_mon.csv ÷ program_user_funnel_mon.csv (전월 MAU)"
  formula: |
    한국어: 전월 이탈자 수 / 지지난달 MAU × 100
    SPL:   churn_count_mon / mau_prev * 100
  related:
    prev: churn_rate_mon_prev
    diff: churn_rate_mon_diff
    numerator: "(SPL 내부) churn_count_mon"
    denominator: mau_prev
  description: "전월 1개월간 이탈한 사용자 수를 지지난달 MAU로 나눈 비율."
  example: 45.2
  note: "이전 이름: churn_mon. _rate 접미사 추가로 비율 지표임을 명시."

churn_rate_mon_prev:
