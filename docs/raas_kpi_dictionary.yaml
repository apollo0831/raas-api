    SPL:   m1_ret - m1_ret_prev
  description: "전월 vs 지지난달 M1 유지율 차이(pp). 월 단위 유지력 변화."
  example: 0.7
  note: "이전 이름: m1_diff"


# ─────────────────────────────────────────────────────────────────────────────
# Category L. Retention - New User Cohort (유지율 - 신규 코호트)
# 첫 청취 시점의 신규 사용자가 N일/주/달 후에도 활성하는 비율
#
# 카테고리 K와의 차이:
#   - K (전체 코호트): 해당 시점 모든 활성 사용자 기준
#   - L (신규 코호트): 신규 설치 후 처음 청취한 사용자만을 추적 ★ 본 카테고리
#
# 신규 사용자 정의:
#   - SBS 라디오 앱(고릴라)은 별도 회원가입 단계 없음
#   - "신규 사용자" = 앱 신규 설치 후 처음 청취한 사용자
#   - 카테고리 D(new)와 동일한 신규 정의
#
# 의미:
#   - 신규 유입 사용자가 얼마나 안정적으로 정착하는지 측정
#   - 마케팅 채널/캠페인 효과 평가의 핵심 지표
#   - 그로스 펀넬: Acquisition → Activation → Retention 중 Retention 단계
#
# 4가지 시점 정의 (K와 동일하나 코호트만 다름):
#   - new_d1_ret : 첫 청취 후 1일 유지율
#   - new_d7_ret : 첫 청취 후 7일 유지율
#   - new_w1_ret : 첫 청취 후 1주 유지율
#   - new_m1_ret : 첫 청취 후 1개월 유지율
#
# 비율 지표 표준 패턴 (필드별 3종):
#   - 현재값      : new_d1_ret, new_d7_ret, new_w1_ret, new_m1_ret
#   - 비교 기준값  : *_prev
#   - pp 차이     : *_diff
#
# 데이터 출처:
#   - program_newuser_retention_day.csv (D1, D7)
#   - program_newuser_retention_week.csv (W1)
#   - program_newuser_retention_mon.csv (M1)
#   - 모두 TYPE=Dn/Wn/Mn AND COHORT=all
# ─────────────────────────────────────────────────────────────────────────────

# L-1. New User D1 Retention

new_d1_ret:
  label_ko: "신규 D1 유지율"
  label_en: "New User D1 Retention Rate"
  category: user_retention
  type: rate
  unit: "%"
  reference_date: D-1
  window: 1d
  source: "program_newuser_retention_day.csv (TYPE=D1, COHORT=all)"
  formula: |
    한국어: D-2에 신규 설치 후 처음 청취한 사용자 중 D-1에도 활성한 비율
    SPL:   D-2 신규자 ∩ D-1 활성자 / D-2 신규자 × 100
  related:
    prev: new_d1_ret_prev
    diff: new_d1_ret_diff
  description: "전전일(D-2)에 신규 설치 후 처음 청취한 신규 사용자가 그 다음날(D-1)에도 앱을 사용한 비율. 신규 유입 직후 첫 24시간 정착률 — 그로스 마케팅 핵심 지표."
  example: 42.8

new_d1_ret_prev:
  label_ko: "신규 D1 유지율 (D-8 비교값)"
  label_en: "New User D1 Retention 7-day Prior"
  category: user_retention
  type: rate
  unit: "%"
  reference_date: D-8
  window: 1d
  description: "전주 동요일(D-8)의 신규 D1 유지율. new_d1_ret_diff 계산의 기준값."
  example: 41.5
  note: "이전 이름: new_d1_ret_pw"

new_d1_ret_diff:
  label_ko: "신규 D1 유지율 전주 대비 증감"
  label_en: "New User D1 Retention WoW Difference"
  category: user_retention
  type: pp
  unit: pp
  formula: |
    한국어: 신규 D1 유지율 - 7일 전 신규 D1 유지율
    SPL:   new_d1_ret - new_d1_ret_prev
  description: "D-1 vs D-8의 신규 D1 유지율 차이(pp). 양수일수록 신규 정착 개선."
  example: 1.3
  note: "이전 이름: new_d1_diff"

# L-2. New User D7 Retention

new_d7_ret:
  label_ko: "신규 D7 유지율"
  label_en: "New User D7 Retention Rate"
  category: user_retention
  type: rate
  unit: "%"
  reference_date: D-1
  window: 1d
  source: "program_newuser_retention_day.csv (TYPE=D7, COHORT=all)"
  formula: |
    한국어: D-8에 신규 설치 후 처음 청취한 사용자 중 D-1에도 활성한 비율
    SPL:   D-8 신규자 ∩ D-1 활성자 / D-8 신규자 × 100
  related:
