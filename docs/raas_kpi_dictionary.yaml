  type: rate
  unit: "%"
  reference_date: D-1
  window: 1d
  source: "program_user_retention_day.csv (TYPE=D1, COHORT=all)"
  formula: |
    한국어: D-2 활성 사용자 중 D-1에도 활성한 비율
    SPL:   D-1 활성자 ∩ D-2 활성자 / D-2 활성자 × 100
  related:
    prev: d1_ret_prev
    diff: d1_ret_diff
  description: "전전일(D-2) 활성한 사용자가 그 다음날(D-1)에도 활성하고 있는 비율. 일별 사용자 정착의 가장 짧은 단위 지표."
  example: 75.3

d1_ret_prev:
  label_ko: "D1 유지율 (D-8 비교값)"
  label_en: "D1 Retention 7-day Prior"
  category: user_retention
  type: rate
  unit: "%"
  reference_date: D-8
  window: 1d
  description: "전주 동요일(D-8)의 D1 유지율. d1_ret_diff 계산의 기준값."
  example: 74.5
  note: "이전 이름: d1_ret_pw"

d1_ret_diff:
  label_ko: "D1 유지율 전주 대비 증감"
