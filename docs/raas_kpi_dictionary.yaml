  note: "이전 이름: react_today"

react_prev:
  label_ko: "일간 복귀 사용자 (D-8 비교값)"
  label_en: "Daily Reactivated Users 7-day Prior"
  category: user_growth
  type: count
  unit: 명
  reference_date: D-8
  window: 1d
  description: "전주 동요일(D-8)의 복귀 사용자 수. react_chg 계산의 기준값."
  example: 4900
  note: "이전 이름: react_pw"

react_chg:
