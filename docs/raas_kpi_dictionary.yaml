  example: 0.4
  note: "이전 이름: churn_mon_diff"

# ─────────────────────────────────────────────────────────────────────────────
# Category H. Deep Listening Rate (깊은청취율)
# 1분 이상 청취자 중 10분 이상까지 청취한 비율 — 일간/주간/월간
#
# 의미:
#   - 광고 노출 가능 활성자(1분+) 중에서 콘텐츠에 몰입한 사용자(10분+) 비율
#   - 라디오 콘텐츠의 매력도/유지력 핵심 지표
#   - 광고 시장에서 핵심 광고 단위 (10분 = 4~5분 광고 + 5분 콘텐츠 청취 가능)
#
# 분자/분모는 카테고리 C(1분/10분 청취 사용자)에서 별도 관리.
#
# 비율 지표 표준 패턴 (3종):
#   - 현재값      : deep_rate, deep_rate_week, deep_rate_mon
#   - 비교 기준값  : deep_rate_prev, deep_rate_week_prev, deep_rate_mon_prev
#   - pp 차이     : deep_rate_diff, deep_rate_week_diff, deep_rate_mon_diff
# ─────────────────────────────────────────────────────────────────────────────

# H-1. Daily Deep Listening Rate

deep_rate:
  label_ko: "일간 깊은청취율"
  label_en: "Daily Deep Listening Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: D-1
  window: 1d
  source: "카테고리 C (dau_1min, dau_10min)에서 직접 계산"
  formula: |
    한국어: 당일 10분 청취자 / 당일 1분 청취자 × 100
    SPL:   dau_10min / dau_1min * 100
  related:
    prev: deep_rate_prev
    diff: deep_rate_diff
    numerator: dau_10min
    denominator: dau_1min
  description: "전일(D-1) 1분 이상 청취자 중 10분 이상까지 청취한 사용자 비율. 콘텐츠 몰입도와 광고 노출 효과를 동시에 가늠하는 핵심 지표."
  example: 57.5

deep_rate_prev:
  label_ko: "일간 깊은청취율 (D-8 비교값)"
  label_en: "Daily Deep Listening Rate 7-day Prior"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: D-8
  window: 1d
  description: "전주 동요일(D-8)의 일간 깊은청취율. deep_rate_diff 계산의 기준값."
  example: 56.8
  note: "이전 이름: deep_rate_pw"

deep_rate_diff:
  label_ko: "일간 깊은청취율 전주 대비 증감"
  label_en: "Daily Deep Listening Rate WoW Difference"
  category: user_quality
  type: pp
  unit: pp
  formula: |
    한국어: 일간 깊은청취율 - 7일 전 일간 깊은청취율
    SPL:   deep_rate - deep_rate_prev
  description: "D-1 vs D-8의 깊은청취율 차이(pp). 양수일수록 콘텐츠 몰입도 개선."
  example: 0.7

# H-2. Weekly Deep Listening Rate (전주 누적 기준)

deep_rate_week:
  label_ko: "주간 깊은청취율"
  label_en: "Weekly Deep Listening Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 전주 월요일
  window: "7d_calendar (Mon-Sun)"
  source: "카테고리 C (wau_1min, wau_10min)에서 직접 계산"
  formula: |
