  type: count
  unit: 명
  reference_date: 지지난달 1일
  window: "1mon_calendar"
  description: "지지난달 1일~말일의 월간 신규 사용자 수. new_mon_chg 계산의 기준값."
  example: 192000
  note: "이전 이름: new_mon_pw"

new_mon_chg:
  label_ko: "월간 신규 전월 대비 증감률"
