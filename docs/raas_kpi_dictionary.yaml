  note: "이전 이름: deep_rate_mon_pw"

deep_rate_mon_diff:
  label_ko: "월간 깊은청취율 전월 대비 증감"
  label_en: "Monthly Deep Listening Rate MoM Difference"
  category: user_quality
  type: pp
  unit: pp
  formula: |
    한국어: 월간 깊은청취율 - 지지난달 월간 깊은청취율
    SPL:   deep_rate_mon - deep_rate_mon_prev
  description: "전월 vs 지지난달 깊은청취율 차이(pp). 월 단위 콘텐츠 몰입도 변화."
  example: 0.7


# ─────────────────────────────────────────────────────────────────────────────
# Category I. Engagement Rate (참여율)
# 활성 사용자 중 핵심 기능을 사용한 비율 — 일간/주간/월간
#
# 정의:
#   참여율 = 참여 사용자 / DAU × 100
#   "참여"의 정의는 program_user_engage_*.csv의 TYPE=TOTAL_USER에서 결정.
#
# "참여" 액션 (3종 중 1개 이상 수행):
#   1. 공감로그 작성 (방송 청취 중 공감 표시 / 텍스트 입력)
#   2. 방송 공유하기 (외부 SNS/메신저로 라디오 콘텐츠 공유)
#   3. 검색 (앱 내 프로그램/게스트/곡 등 검색)
#
# 단순 청취(passive listening)와 구분되는 "능동 사용" 지표.
# 라디오 앱의 양방향성/소셜성 강도를 측정.
#
# 비율 지표 표준 패턴 (3종):
#   - 현재값      : engage_rate, engage_rate_week, engage_rate_mon
#   - 비교 기준값  : engage_rate_prev, engage_rate_week_prev, engage_rate_mon_prev
#   - pp 차이     : engage_rate_diff, engage_rate_week_diff, engage_rate_mon_diff
#
# ⚠️ 큰 변경: 기존 engage_week/engage_mon → engage_rate_week/engage_rate_mon
#    (_rate 접미사 일관 적용)
# ─────────────────────────────────────────────────────────────────────────────

# I-1. Daily Engagement Rate

engage_rate:
  label_ko: "일간 참여율"
  label_en: "Daily Engagement Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: D-1
  window: 1d
  source: "program_user_engage_day.csv (TYPE=TOTAL_USER) ÷ program_user_funnel_day.csv (TYPE=ALL)"
  formula: |
    한국어: 당일 참여 사용자 / 당일 DAU × 100
    SPL:   engage_count / dau * 100
  related:
    prev: engage_rate_prev
    diff: engage_rate_diff
    numerator: "(SPL 내부) engage_count"
    denominator: dau
  description: |
    전일(D-1) DAU 중 참여 액션을 1회 이상 수행한 사용자 비율.
    참여 액션 = (1) 공감로그 작성, (2) 방송 공유하기, (3) 검색
    단순 청취를 넘어 능동적인 앱 사용 정도를 측정.
  example: 38.5

engage_rate_prev:
  label_ko: "일간 참여율 (D-8 비교값)"
  label_en: "Daily Engagement Rate 7-day Prior"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: D-8
  window: 1d
  description: "전주 동요일(D-8)의 일간 참여율. engage_rate_diff 계산의 기준값."
  example: 37.8
  note: "이전 이름: engage_rate_pw"

engage_rate_diff:
  label_ko: "일간 참여율 전주 대비 증감"
  label_en: "Daily Engagement Rate WoW Difference"
  category: user_quality
  type: pp
  unit: pp
  formula: |
    한국어: 일간 참여율 - 7일 전 일간 참여율
    SPL:   engage_rate - engage_rate_prev
  description: "D-1 vs D-8의 참여율 차이(pp). 양수일수록 능동 사용 개선."
  example: 0.7
  note: "이전 이름: engage_diff"

# I-2. Weekly Engagement Rate (전주 누적 기준)

engage_rate_week:
  label_ko: "주간 참여율"
  label_en: "Weekly Engagement Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 전주 월요일
  window: "7d_calendar (Mon-Sun)"
  source: "program_user_engage_week.csv (TYPE=TOTAL_USER) ÷ program_user_funnel_week.csv (TYPE=ALL)"
  formula: |
    한국어: 전주 참여 사용자 / 전주 WAU × 100
    SPL:   engage_count_week / wau * 100
  related:
    prev: engage_rate_week_prev
    diff: engage_rate_week_diff
    numerator: "(SPL 내부) engage_count_week"
    denominator: wau
  description: "전주 7일간 WAU 중 참여 액션을 수행한 사용자 비율."
  example: 52.3
  note: "이전 이름: engage_week. _rate 접미사 추가로 비율 지표임을 명시."

engage_rate_week_prev:
  label_ko: "주간 참여율 (지지난주값)"
  label_en: "Weekly Engagement Rate 1 Week Prior"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 지지난주 월요일
  window: "7d_calendar"
  description: "지지난주 7일간의 주간 참여율. engage_rate_week_diff 계산의 기준값."
  example: 51.5
  note: "이전 이름: engage_week_pw"

engage_rate_week_diff:
  label_ko: "주간 참여율 전주 대비 증감"
  label_en: "Weekly Engagement Rate WoW Difference"
  category: user_quality
  type: pp
  unit: pp
  formula: |
    한국어: 주간 참여율 - 지지난주 주간 참여율
    SPL:   engage_rate_week - engage_rate_week_prev
  description: "전주 vs 지지난주 참여율 차이(pp)."
  example: 0.8
  note: "이전 이름: engage_week_diff"

# I-3. Monthly Engagement Rate (전월 누적 기준)

engage_rate_mon:
  label_ko: "월간 참여율"
  label_en: "Monthly Engagement Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 전월 1일
  window: "1mon_calendar"
  source: "program_user_engage_mon.csv (TYPE=TOTAL_USER) ÷ program_user_funnel_mon.csv (TYPE=ALL)"
  formula: |
    한국어: 전월 참여 사용자 / 전월 MAU × 100
    SPL:   engage_count_mon / mau * 100
  related:
    prev: engage_rate_mon_prev
    diff: engage_rate_mon_diff
    numerator: "(SPL 내부) engage_count_mon"
    denominator: mau
  description: "전월 1개월간 MAU 중 참여 액션을 수행한 사용자 비율."
  example: 65.8
  note: "이전 이름: engage_mon. _rate 접미사 추가로 비율 지표임을 명시."

engage_rate_mon_prev:
  label_ko: "월간 참여율 (지지난달값)"
  label_en: "Monthly Engagement Rate 1 Month Prior"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 지지난달 1일
  window: "1mon_calendar"
  description: "지지난달 1개월간의 월간 참여율. engage_rate_mon_diff 계산의 기준값."
  example: 64.9
  note: "이전 이름: engage_mon_pw"

engage_rate_mon_diff:
  label_ko: "월간 참여율 전월 대비 증감"
  label_en: "Monthly Engagement Rate MoM Difference"
  category: user_quality
  type: pp
  unit: pp
  formula: |
    한국어: 월간 참여율 - 지지난달 월간 참여율
    SPL:   engage_rate_mon - engage_rate_mon_prev
  description: "전월 vs 지지난달 참여율 차이(pp). 월 단위 능동 사용 추세."
  example: 0.9
  note: "이전 이름: engage_mon_diff"


# ─────────────────────────────────────────────────────────────────────────────
# Category J. Habit Formation Rate (습관형성률)
# 신규 사용자 중 일정 빈도로 앱을 사용해 습관을 형성한 비율 — 일간/주간/월간
#
# 정의:
#   습관형성률 = 3D7D_1M / ALL × 100
#     - 분자: 신규 사용자 중 7일 윈도우에서 3일 이상(각 1분 이상 청취) 사용한 사용자
#     - 분모: 동일 코호트의 전체 신규 사용자
#     - 데이터: program_newuser_funnel_*.csv
#
# 코드 해석:
#   3D = 3 days (3일 이상 사용)
#   7D = 7-day window (7일 측정 윈도우)
#   1M = 1 month? (코드명 보존, 정확한 의미는 미확정 — 운영팀 확인 필요)
#
# 시점 시프트 (일간 데이터):
#   - SPL 코드: relative_time(_time,"+6d")
#   - 7일 측정 윈도우가 끝나는 시점에 결과를 표시하기 위해 +6일 시프트
#
# 의미:
#   - 신규 유입이 단순 1회성 사용으로 끝나지 않고 정착하는 비율
#   - 앱 사용 습관 형성의 핵심 지표 (그로스 마케팅의 활성화 단계)
#
# 비율 지표 표준 패턴 (3종):
#   - 현재값      : habit_rate, habit_rate_week, habit_rate_mon
#   - 비교 기준값  : habit_rate_prev, habit_rate_week_prev, habit_rate_mon_prev
#   - pp 차이     : habit_rate_diff, habit_rate_week_diff, habit_rate_mon_diff
#
# ⚠️ 큰 변경: 기존 habit_week/habit_mon → habit_rate_week/habit_rate_mon
#    (_rate 접미사 일관 적용)
# ─────────────────────────────────────────────────────────────────────────────

# J-1. Daily Habit Formation Rate

habit_rate:
  label_ko: "일간 습관형성률"
  label_en: "Daily Habit Formation Rate"
  category: user_habit
  type: rate
  unit: "%"
  reference_date: D-1
  window: 1d
  source: "program_newuser_funnel_day.csv (TYPE=3D7D_1M ÷ TYPE=ALL, +6d 시프트)"
  formula: |
    한국어: 신규 중 7일 윈도우에서 3일 이상(1분 이상 청취) 사용한 사용자 / 전체 신규 × 100
    SPL:   habit_count / new_count * 100
  related:
    prev: habit_rate_prev
    diff: habit_rate_diff
    numerator: "(SPL 내부) habit_count (3D7D_1M)"
    denominator: "(SPL 내부) new_count (ALL)"
  description: |
    전일(D-1) 시점에서 측정한 신규 사용자 중 7일 윈도우에서 3일 이상(각 1분 이상 청취) 사용해 습관을 형성한 비율.
    SPL에서 +6일 시프트를 적용하는 이유: 코호트 가입 후 7일간의 측정 윈도우가 끝나는 시점에 결과가 표시되도록 정렬.
    (예: 4월 22일 코호트의 7일 윈도우 측정 결과가 4월 28일 데이터로 표시됨)
  example: 22.3

habit_rate_prev:
  label_ko: "일간 습관형성률 (D-8 비교값)"
  label_en: "Daily Habit Formation Rate 7-day Prior"
  category: user_habit
  type: rate
  unit: "%"
  reference_date: D-8
