  category: user_retention
  type: rate
  unit: "%"
  reference_date: D-8
  window: 1d
  description: "전주 동요일(D-8)의 D7 유지율. d7_ret_diff 계산의 기준값."
  example: 51.8
  note: "이전 이름: d7_ret_pw"

d7_ret_diff:
  label_ko: "D7 유지율 전주 대비 증감"
  label_en: "D7 Retention WoW Difference"
  category: user_retention
  type: pp
  unit: pp
  formula: |
    한국어: D7 유지율 - 7일 전 D7 유지율
    SPL:   d7_ret - d7_ret_prev
