  description: "지지난주의 주간 깊은청취율. deep_rate_week_diff 계산의 기준값."
  example: 60.1
  note: "이전 이름: deep_rate_week_pw"

deep_rate_week_diff:
  label_ko: "주간 깊은청취율 전주 대비 증감"
  label_en: "Weekly Deep Listening Rate WoW Difference"
  category: user_quality
  type: pp
  unit: pp
  formula: |
    한국어: 주간 깊은청취율 - 지지난주 주간 깊은청취율
    SPL:   deep_rate_week - deep_rate_week_prev
  description: "전주 vs 지지난주 깊은청취율 차이(pp)."
  example: 0.4

# H-3. Monthly Deep Listening Rate (전월 누적 기준)

deep_rate_mon:
  label_ko: "월간 깊은청취율"
  label_en: "Monthly Deep Listening Rate"
  category: user_quality
  type: rate
  unit: "%"
  reference_date: 전월 1일
