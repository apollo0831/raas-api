    한국어: (당일 복귀 - 7일 전 복귀) / 7일 전 복귀 × 100
    SPL:   (react - react_prev) / react_prev * 100
  description: "D-1 vs D-8의 복귀 사용자 수 변동률. 휴면 사용자 재유입 추세 파악용."
