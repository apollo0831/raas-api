# ─────────────────────────────────────────────────────────────────────────────
# Category K. Retention - All Cohort (유지율 - 전체 코호트)
# 특정 시점의 활성 사용자가 N일/주/달 후에도 활성하는 비율
#
# 코호트:
#   - 전체 코호트(COHORT=all): 해당 시점에 활성한 모든 사용자
#   - 카테고리 L에서는 신규 코호트(가입자만)를 별도 관리
#
# 4가지 시점 정의:
#   - D1 : 1일 후 유지율 (D-2 활성자 중 D-1에도 활성)
#   - D7 : 7일 후 유지율 (D-8 활성자 중 D-1에도 활성)
#   - W1 : 1주 후 유지율 (지지난주 활성자 중 전주에도 활성, 주간 단위)
#   - M1 : 1개월 후 유지율 (지지난달 활성자 중 전월에도 활성, 월간 단위)
#
# 비율 지표 표준 패턴 (필드별 3종):
#   - 현재값      : d1_ret, d7_ret, w1_ret, m1_ret
#   - 비교 기준값  : *_prev
#   - pp 차이     : *_diff
#
# 데이터 출처:
#   - program_user_retention_day.csv (D1, D7)
#   - program_user_retention_week.csv (W1)
#   - program_user_retention_mon.csv (M1)
#   - 모두 TYPE=Dn/Wn/Mn AND COHORT=all
# ─────────────────────────────────────────────────────────────────────────────

# K-1. D1 Retention (1-day after)

d1_ret:
  label_ko: "D1 유지율 (전체 코호트)"
  label_en: "D1 Retention Rate (All Cohort)"
