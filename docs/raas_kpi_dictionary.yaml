  description: "8일 전(D-8) 활성한 사용자가 1주일 후(D-1)에도 활성하고 있는 비율. 주간 단위 사용자 유지력 지표."
  example: 52.7

d7_ret_prev:
  label_ko: "D7 유지율 (D-8 비교값)"
