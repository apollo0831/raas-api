# ─────────────────────────────────────────────────────────────────────────────
# Category D. New Users (신규 사용자)
# 처음 앱을 활성화한 사용자 — 일간/주간/월간
#
# 신규 사용자 정의:
#   - SBS 라디오 앱(고릴라)은 별도 회원가입 단계 없음
#   - "신규 사용자" = 앱 신규 설치 후 처음 청취한 사용자
#   - 첫 청취 시점이 곧 사용자 발생 시점
#
# 베이스 명명:
#   - new      : 일간 (D-1)
#   - new_week : 주간 일반 (전주 누적)
#   - new_mon  : 월간 일반 (전월 누적)
#
# 각 기간마다 4종 필드 세트:
#   - 절대값       : new, new_week, new_mon
#   - 비교 기준값   : new_prev, new_week_prev, new_mon_prev
#   - 변동률(%)    : new_chg, new_week_chg, new_mon_chg
#   - DAU 대비 비율 : new_share, new_week_share, new_mon_share
# ─────────────────────────────────────────────────────────────────────────────

# D-1. Daily New Users

new:
  label_ko: "일간 신규 사용자"
  label_en: "Daily New Users"
  category: user_growth
  type: count
  unit: 명
  reference_date: D-1
  window: 1d
  source: "program_newuser_funnel_day.csv (TYPE=ALL, PERIOD=1D)"
  related:
    prev: new_prev
    chg: new_chg
    share: new_share
  description: "전일(D-1) 24시간 동안 앱을 신규 설치 후 처음 청취한 순 사용자 수. 신규 유입의 일간 규모."
  example: 8234
  note: "이전 이름: new_today"

new_prev:
  label_ko: "일간 신규 사용자 (D-8 비교값)"
  label_en: "Daily New Users 7-day Prior"
  category: user_growth
  type: count
  unit: 명
  reference_date: D-8
  window: 1d
  description: "전주 동요일(D-8)의 신규 사용자 수. new_chg 계산의 기준값."
  example: 7800
  note: "이전 이름: new_pw"

new_chg:
  label_ko: "일간 신규 전주 대비 증감률"
  label_en: "Daily New Users WoW Change"
  category: user_growth
  type: pct
  unit: "%"
  formula: |
    한국어: (당일 신규 - 7일 전 신규) / 7일 전 신규 × 100
    SPL:   (new - new_prev) / new_prev * 100
  description: "D-1 vs D-8의 신규 사용자 수 변동률. 신규 유입 추세 파악용."
  example: 5.6
  note: "이전 이름: new_wow"

new_share:
  label_ko: "일간 신규 비중 (DAU 대비)"
  label_en: "Daily New Users Share of DAU"
  category: user_growth
  type: pct
  unit: "%"
  formula: |
    한국어: 당일 신규 사용자 / 당일 DAU × 100
    SPL:   new / dau * 100
  description: "DAU 중 신규 사용자가 차지하는 비율. 신규 유입의 상대적 강도 지표."
  example: 6.7
  note: |
    이전 이름: new_pct.
    같은 카테고리의 react_rate(휴면 대비 복귀율)와 의미 구분을 위해 _share로 명명.

# D-2. Weekly New Users (전주 누적)

new_week:
  label_ko: "주간 신규 사용자 (전주 누적)"
