<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" id="metaThemeColor" content="#0d1117">
<meta name="color-scheme" content="dark light">
<script>(function(){var t=localStorage.getItem('raas_theme')||'dark';document.getElementById('metaThemeColor').setAttribute('content',t==='dark'?'#0d1117':'#f0f2f5');}());</script>
<title>RAAS — 고릴라 AI 어시스턴트</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --bg0: #0d1117;
  --bg1: #13181f;
  --bg2: #1a2130;
  --bg3: #1f2937;
  --bg4: #2d3748;
  --bg5: #374151;
  --line:  rgba(255,255,255,.07);
  --line2: rgba(255,255,255,.12);
  --text:  #e8edf3;
  --text2: #d1d8e0;
  --sub:   #8b95a5;
  --dim:   #4a5566;
  --accent: #4f8ef7;
  --accent-soft: rgba(79,142,247,.15);
  --green:  #34c78a;
  --red:    #f26b6b;
  --yellow: #f5a623;
  --purple: #a78bfa;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'DM Sans', 'Noto Sans KR', sans-serif;
  --sidebar-w: 256px;
  --kpi-w: 308px;
  /* 폰트 스케일 +40% */
  --fs-xs:  15px;  /* 구 11px */
  --fs-sm:  17px;  /* 구 12px */
  --fs-md:  18px;  /* 구 13px */
  --fs-base:21px;  /* 구 15px */
  --fs-lg:  20px;  /* 구 14px */
  --fs-xl:  25px;  /* 구 18px */
  --fs-2xl: 36px;  /* 구 26px */
}

[data-theme="light"] {
  --bg0: #f0f2f5;
  --bg1: #ffffff;
  --bg2: #f7f8fa;
  --bg3: #edf0f4;
  --bg4: #dde2ea;
  --bg5: #c8d0db;
  --line:  rgba(0,0,0,.08);
  --line2: rgba(0,0,0,.13);
  --text:  #111827;
  --text2: #1f2937;
  --sub:   #6b7a90;
  --dim:   #9aa3b2;
  --accent: #2563eb;
  --accent-soft: rgba(37,99,235,.12);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg0);
  color:var(--text);
  font-family:var(--sans);
  font-size:var(--fs-base);
  line-height:1.65;
  display:flex;
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  height:100%;background:var(--bg1);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width .22s ease,min-width .22s ease;
  flex-shrink:0;
}
.sidebar.collapsed{width:0;min-width:0}
.sidebar-close-btn{
  display:none;
  position:absolute;top:12px;right:12px;
  width:30px;height:30px;
  align-items:center;justify-content:center;
  border:none;background:var(--bg3);color:var(--sub);
  border-radius:6px;cursor:pointer;
  transition:background .12s,color .12s;
}
.sidebar-close-btn:hover{background:var(--bg4);color:var(--text)}
.sidebar-backdrop{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.55);z-index:299;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.sidebar-backdrop.visible{opacity:1;pointer-events:auto}
.sidebar-top{padding:16px;border-bottom:1px solid var(--line);flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between}
.sidebar-top-info{display:flex;flex-direction:column}
.btn-theme{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--dim);
  border-radius:6px;cursor:pointer;flex-shrink:0;margin-top:2px;
  transition:background .12s,color .12s;
}
.btn-theme:hover{background:var(--bg3);color:var(--text)}
.sidebar-logo{
  font-size:var(--fs-xl);font-weight:700;letter-spacing:-.5px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:3px;
}
.sidebar-date{font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim)}
.btn-new-chat{
  margin:10px 12px 0;
  display:flex;align-items:center;gap:9px;
  padding:10px 12px;
  background:transparent;border:none;border-radius:8px;
  color:var(--text);font-size:var(--fs-md);font-weight:400;
  cursor:pointer;font-family:var(--sans);
  transition:background .12s;width:calc(100% - 24px);
  line-height:1.4;
}
.btn-new-chat:hover{background:var(--bg3)}
.sidebar-section{
  padding:16px 16px 6px;
  font-size:var(--fs-xs);font-weight:500;color:var(--dim);
  flex-shrink:0;
}
.sidebar-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.quick-queries{padding:2px 8px;display:flex;flex-direction:column;gap:2px}
.quick-query-btn{
  display:flex;align-items:center;gap:9px;
  padding:10px 12px;border-radius:8px;border:none;
  background:transparent;color:var(--text);
  font-size:var(--fs-md);font-family:var(--sans);font-weight:400;
  cursor:pointer;text-align:left;
  transition:background .12s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.4;
}
.quick-query-btn:hover{background:var(--bg3)}
.history-list{
  padding:2px 8px;
  display:flex;flex-direction:column;gap:2px;
}
.history-item{
  padding:10px 12px;border-radius:8px;cursor:pointer;
  font-size:var(--fs-md);color:var(--text);font-weight:400;
  transition:background .12s;
  overflow:hidden;display:flex;align-items:center;gap:4px;
  line-height:1.4;
}
.history-item:hover{background:var(--bg3)}
.history-item-q{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-time{font-size:var(--fs-xs);color:var(--dim);white-space:nowrap;flex-shrink:0}
.history-empty{font-size:var(--fs-sm);color:var(--dim);padding:10px 12px;line-height:1.6}
.hist-cached{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-right:2px}

/* ── MAIN CHAT ── */
.chat-main{
  flex:1;height:100%;display:flex;flex-direction:column;
  overflow:hidden;min-width:0;
}
.chat-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;
  border-bottom:1px solid var(--line);
  background:var(--bg0);flex-shrink:0;
}
.btn-icon{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--sub);
  border-radius:6px;cursor:pointer;
  transition:background .12s,color .12s;flex-shrink:0;
}
.btn-icon:hover{background:var(--bg3);color:var(--text)}
.chat-header-title{
  font-size:var(--fs-lg);font-weight:600;color:var(--text);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chat-header-meta{font-size:var(--fs-sm);color:var(--dim);font-family:var(--mono);flex-shrink:0}

/* ── THREAD ── */
.chat-thread{flex:1;overflow-y:auto;padding:20px 0}
.thread-inner{
  max-width:800px;margin:0 auto;padding:0 32px;
  display:flex;flex-direction:column;gap:0;
  width:100%;
}

/* Welcome */
.welcome{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:55vh;text-align:center;gap:16px;
}
.welcome-logo{
  font-size:var(--fs-2xl);font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1.3;
}
.welcome-sub{font-size:var(--fs-md);color:var(--sub);max-width:min(640px,88%);line-height:1.8;word-break:keep-all}
.welcome-chips{display:none}

/* Messages */
.msg{display:flex;gap:12px;padding:14px 0}
.msg-user{flex-direction:row-reverse}
.msg-avatar{display:none}
.msg{display:flex;gap:0;padding:12px 0}
.msg-user{flex-direction:row-reverse}
.msg-body{flex:1;min-width:0}
.msg-user .msg-body{display:flex;justify-content:flex-end}
.msg-user-text{
  max-width:80%;background:var(--bg4);border:1px solid var(--line2);
  border-radius:18px 18px 4px 18px;padding:12px 16px;
  font-size:var(--fs-base);line-height:1.65;color:var(--text);word-break:keep-all;
}
.msg-ai-text{font-size:var(--fs-base);line-height:1.65;color:var(--text2);white-space:pre-wrap;word-break:keep-all}
.msg-ai-name{display:none}

/* Typing */
.typing-indicator{display:flex;gap:4px;padding:6px 0;align-items:center}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:tbounce 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes tbounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* ── INPUT BAR ── */
.input-wrap{
  padding:12px 16px 16px;background:var(--bg0);
  flex-shrink:0;
}
.input-inner{
  max-width:800px;margin:0 auto;width:100%;
  position:relative;
}
.input-box{
  width:100%;background:var(--bg2);border:1px solid var(--line2);
  border-radius:14px;padding:14px 60px 14px 18px;
  font-size:var(--fs-base);color:var(--text);font-family:var(--sans);
  line-height:1.6;resize:none;min-height:72px;max-height:260px;
  outline:none;transition:border-color .15s;display:block;
}
.input-box::placeholder{color:var(--dim)}
.input-box:focus{border-color:rgba(79,142,247,.5)}
.btn-send{
  position:absolute;right:8px;bottom:8px;
  width:40px;height:40px;background:var(--accent);border:none;
  border-radius:10px;color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .15s,transform .1s;
}
.btn-send:hover{background:#6fa3f9}
.btn-send:active{transform:scale(.93)}
.btn-send:disabled{background:var(--bg4);cursor:not-allowed}
.input-hint{font-size:var(--fs-xs);color:var(--dim);text-align:center;margin-top:6px}

/* ── KPI PANEL ── */
.kpi-panel{
  width:var(--kpi-w);min-width:var(--kpi-w);height:100%;
  background:var(--bg1);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width .22s ease,min-width .22s ease;flex-shrink:0;
}
.kpi-panel.collapsed{width:0;min-width:0}
.kpi-close-mobile{
  display:none;
  position:absolute;top:12px;right:12px;
  width:30px;height:30px;
  align-items:center;justify-content:center;
  border:none;background:var(--bg3);color:var(--sub);
  border-radius:6px;cursor:pointer;
  transition:background .12s,color .12s;
}
.kpi-close-mobile:hover{background:var(--bg4);color:var(--text)}
.kpi-panel-header{
  padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.kpi-panel-title{font-size:var(--fs-md);font-weight:600;color:var(--sub);flex:1}
.kpi-refresh-btn{
  font-size:var(--fs-xs);color:var(--accent);background:none;
  border:none;cursor:pointer;font-family:var(--sans);padding:0;
}
.kpi-scroll{flex:1;overflow-y:auto;padding:14px}
.kpi-section{margin-bottom:18px}
.kpi-section-title{
  font-size:var(--fs-xs);font-weight:600;color:var(--dim);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;
}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi-card{
  background:var(--bg2);border-radius:10px;padding:10px 12px;
  border:1px solid var(--line);
}
.kpi-card-label{font-size:var(--fs-xs);color:var(--sub);margin-bottom:3px}
.kpi-card-value{font-size:var(--fs-base);font-weight:700;color:var(--text);font-family:var(--mono)}
.kpi-card-wow{font-size:var(--fs-xs);font-family:var(--mono)}
.kpi-card-wow.up{color:var(--green)}
.kpi-card-wow.dn{color:var(--red)}
.kpi-card-wow.flat{color:var(--dim)}
.alert-item{
  display:flex;align-items:flex-start;gap:8px;
  padding:10px 12px;border-radius:8px;margin-bottom:6px;
  font-size:var(--fs-sm);line-height:1.5;
}
.alert-item.red{background:rgba(242,107,107,.1);border:1px solid rgba(242,107,107,.25)}
.alert-item.yellow{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25)}
.alert-item.green{background:rgba(52,199,138,.1);border:1px solid rgba(52,199,138,.25)}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.alert-dot.red{background:var(--red)}
.alert-dot.yellow{background:var(--yellow)}
.alert-dot.green{background:var(--green)}
.alert-text{color:var(--text2)}
.channel-chips{display:flex;flex-wrap:wrap;gap:7px}
.channel-chip{
  padding:5px 12px;border-radius:16px;font-size:var(--fs-sm);
  background:var(--bg3);border:1px solid var(--line);color:var(--sub);
  font-family:var(--mono);
}
.channel-chip strong{color:var(--text);font-weight:600;margin-left:4px}
.kpi-loading{font-size:var(--fs-sm);color:var(--dim);padding:16px 0;text-align:center}

/* ── CHARTS (AI answer blocks) ── */
.ai-chart-box{
  margin:10px 0;padding:12px;overflow:hidden;
}
.ai-chart-meta{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:8px;font-size:var(--fs-sm);color:var(--sub);margin-bottom:8px;flex-wrap:wrap;
}
.sp-period-btns{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.sp-btn{
  padding:4px 11px;font-size:var(--fs-xs);border-radius:5px;
  border:1px solid var(--line2);background:transparent;color:var(--sub);
  cursor:pointer;font-family:var(--sans);transition:all .12s;
}
.sp-btn.active{background:var(--bg4);color:var(--text);border-color:var(--bg5)}
.sp-btn:disabled{opacity:.3;cursor:not-allowed}
.ai-source{font-size:var(--fs-xs);color:var(--dim);margin-top:6px}

/* ranking table */
.rk-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.ai-rank-table{border-collapse:collapse;font-size:var(--fs-md)}
.ai-rank-table th{padding:7px 9px;color:var(--sub);font-weight:500;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ai-rank-table th:nth-child(2){text-align:left}
.ai-rank-table td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:var(--fs-sm);color:var(--text2);white-space:nowrap}
.ai-rank-table td.rk-name{text-align:left;font-family:var(--sans);color:var(--text);max-width:min(160px,38vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-rank-table td.rk-n{color:var(--dim)}
.rk-pos{color:var(--green)}.rk-neg{color:var(--red)}
.rk-hidden{display:none}
.rk-toggle-btn{margin-top:8px;font-size:var(--fs-sm);color:var(--accent);background:none;border:none;cursor:pointer;font-family:var(--sans)}

/* overview table */
.ov-wrap{overflow:hidden}
.ov-scroll{overflow-x:auto;max-width:100%}
.ov-table{border-collapse:collapse;font-size:var(--fs-sm);min-width:600px}
.ov-group-row th{padding:4px 7px}
.ov-group-th{text-align:center;font-size:var(--fs-xs);color:var(--dim);border-bottom:1px solid var(--line)}
.ov-sticky{position:sticky;left:0;z-index:2;background:var(--bg2)}
.ov-sticky2{position:sticky;left:0;z-index:3;background:var(--bg2)}
.ov-th-no,.ov-th-name,.ov-th{padding:5px 7px;color:var(--sub);font-weight:500;text-align:right;white-space:nowrap}
.ov-th-name{text-align:left;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.ov-no,.ov-name,.ov-v{padding:5px 7px;border-bottom:1px solid var(--line);color:var(--text2);text-align:right;white-space:nowrap;font-family:var(--mono);font-size:var(--fs-sm)}
.ov-name{text-align:left;color:var(--text);font-family:var(--sans);max-width:40vw;overflow:hidden;text-overflow:ellipsis}

/* badges */
.pr-badge{display:inline-block;font-size:var(--fs-xs);padding:0 6px;border-radius:4px;font-weight:600;vertical-align:middle;margin-left:4px}
.pr-badge.weekend{background:rgba(167,139,250,.2);color:var(--purple)}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .sidebar{
    position:fixed;left:-80vw;top:0;
    width:80vw !important;min-width:80vw !important;
    z-index:300;box-shadow:4px 0 24px rgba(0,0,0,.55);
    transition:left .22s ease;
  }
  .sidebar.mobile-open{left:0}
  .sidebar-close-btn{display:flex}
  .sidebar-backdrop{display:block;pointer-events:none}
  .kpi-panel{
    position:fixed;right:-80vw;top:0;
    width:80vw !important;min-width:80vw !important;
    z-index:300;box-shadow:-4px 0 24px rgba(0,0,0,.55);
    transition:right .22s ease;
  }
  .kpi-panel.mobile-open{right:0}
  .kpi-close-mobile{display:flex}
}
@media(max-width:900px){
  .thread-inner{padding:0 16px;max-width:100%}
  .input-inner{padding:0}
  .msg-user-text{max-width:90%}
}
@media(max-width:600px){
  .thread-inner{padding:0 14px}
  .msg-ai-text{line-height:1.4}
}
</style>
</head>
<body>

<!-- ── SIDEBAR BACKDROP ── -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- ── SIDEBAR ── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-top-info">
      <div class="sidebar-logo">RAAS</div>
      <div class="sidebar-date" id="sidebarDate">—</div>
    </div>
    <button class="btn-theme" id="btnTheme" title="테마 전환"></button>
  </div>
  <button class="btn-new-chat" id="btnNewChat">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    새 대화
  </button>
  <div class="sidebar-scroll">
    <div class="sidebar-section">빠른 질의</div>
    <div class="quick-queries" id="quickQueries"></div>
    <div class="sidebar-section">최근 질의</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">아직 질의 내역이 없습니다.</div>
    </div>
  </div>
</aside>

<!-- ── MAIN CHAT ── -->
<main class="chat-main">
  <header class="chat-header">
    <button class="btn-icon" id="btnToggleSidebar" title="사이드바">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span class="chat-header-title">고릴라 라디오 데이터 어시스턴트</span>
    <button class="btn-icon" id="btnToggleKpi" title="KPI 패널">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
    </button>
  </header>

  <div class="chat-thread" id="chatThread">
    <div class="thread-inner" id="threadInner">
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-logo">안녕하세요 👋</div>

<script>
// ────────────────────────────────────────────────
// CONFIG
// ────────────────────────────────────────────────
const RAAS_USER_ID = (() => {
  let id = localStorage.getItem('raas_uid');
  if (!id) { id = 'u_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('raas_uid', id); }
  return id;
})();

const QUICK_QUERIES = [
  '어제 DAU는?',
  '이번 주 DAU 추이',
  '파워FM vs 러브FM DAU 추이',
  '컬투쇼 유지율 현황',
  '프로그램별 MAU 순위',
  '최근 이탈율 변화',
  '신규 유입 트렌드',
  '전체 종합 지표 요약',
  'RAAS에는 어떤 지표들이 있나요?',
];

// ────────────────────────────────────────────────
// QUERY CACHE
// 답변 캐시: 당일 REFRESH_HOUR 이후 생성된 항목만 유효 (Splunk 갱신 기준)
// 질문 보관: 7일 / 답변 보관: 당일 갱신 이후만
// ────────────────────────────────────────────────
const REFRESH_HOUR = 7;

function _todayRefresh() {
  const d = new Date(); d.setHours(REFRESH_HOUR, 0, 0, 0); return d;
}
function _loadQCache() {
  try { return JSON.parse(localStorage.getItem('raas_qcache') || '[]'); } catch { return []; }
}
function _saveQCache(arr) { localStorage.setItem('raas_qcache', JSON.stringify(arr)); }

function _cleanQCache() {
  const cutoff = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
  const refresh = _todayRefresh();
  const arr = _loadQCache()
    .filter(e => new Date(e.cachedAt) >= cutoff)
    .map(e => new Date(e.cachedAt) < refresh ? { ...e, answerHTML: null } : e);
  _saveQCache(arr);
}

// 데이터 버전 체크 — Splunk/CSV 갱신 시 캐시 자동 무효화
async function _checkDataVersion() {
  try {
    const res = await fetch('/api/timeline/meta');
    if (!res.ok) return;
    const meta = await res.json();
    const newVer = meta.date_max;
    if (!newVer) return;
    const storedVer = localStorage.getItem('raas_data_version');
    if (storedVer !== newVer) {
      // 데이터 갱신됨 → 캐시된 답변 HTML 전체 무효화
      const arr = _loadQCache().map(e => ({ ...e, answerHTML: null }));
      _saveQCache(arr);
      localStorage.setItem('raas_data_version', newVer);
    }
  } catch (_) {}
}

function _getCachedAnswer(question) {
  const refresh = _todayRefresh();
  return _loadQCache()
    .filter(e => e.question === question && e.answerHTML && new Date(e.cachedAt) >= refresh)
    .sort((a, b) => new Date(b.cachedAt) - new Date(a.cachedAt))[0]?.answerHTML ?? null;
}

function _saveCachedAnswer(question, answerHTML) {
  let arr = _loadQCache().filter(e => e.question !== question);
  arr.push({ question, answerHTML, cachedAt: new Date().toISOString() });
  if (arr.length > 100) arr = arr.slice(-100);
  _saveQCache(arr);
}

// ────────────────────────────────────────────────
// DATE
// ────────────────────────────────────────────────
(function(){
  const d = new Date();
  const s = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('sidebarDate').textContent = s;
})();

// ────────────────────────────────────────────────
// FORMATTERS
// ────────────────────────────────────────────────
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function renderAiText(s) {
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function fmtK(v) {
  if (v == null || isNaN(v)) return '—';
  if (Math.abs(v) >= 10000) return (v/10000).toFixed(1) + '만';
  return v >= 1000 ? v.toLocaleString() : String(v);
}
function fmtP(v) { return (v == null || isNaN(v)) ? '—' : v.toFixed(1) + '%'; }
function fmtD(v, suf='%') { return (v == null || isNaN(v)) ? '—' : (v >= 0 ? '+' : '') + v.toFixed(1) + suf; }
function wowClass(v) { return v == null ? '' : v > 0 ? 'rk-pos' : v < 0 ? 'rk-neg' : ''; }
function formatRelTime(iso) {
  const d = new Date((iso.includes('Z')||iso.includes('+')) ? iso : iso+'Z');
  const m = Math.floor((Date.now() - d.getTime()) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '시간 전';
  const days = Math.floor(h / 24);
  return days < 7 ? days + '일 전' : iso.slice(0, 10);
}

// ────────────────────────────────────────────────
// CHART STORE & PERIOD HANDLERS
// ────────────────────────────────────────────────
const _chartStore = {};
const _DAYS_KO = ['일','월','화','수','목','금','토'];
const PERIOD_BTNS_DAILY = [
  {days:7,    label:'7일'},
  {days:30,   label:'1개월'},
  {days:90,   label:'3개월'},
  {days:365,  label:'1년'},
  {days:1825, label:'5년'},
];
// 주간 지표: 단위 = 주(week 수)
const PERIOD_BTNS_WEEKLY = [
  {days:4,   label:'4주'},
  {days:13,  label:'3개월'},
  {days:26,  label:'6개월'},
  {days:52,  label:'1년'},
  {days:260, label:'5년'},
];
// 월간 지표: 단위 = 월(month 수)
const PERIOD_BTNS_MONTHLY = [
  {days:3,  label:'3개월'},
  {days:6,  label:'6개월'},
  {days:12, label:'1년'},
  {days:60, label:'5년'},
];
function _getPeriodBtnSet(cadence) {
  if (cadence === 'weekly')  return PERIOD_BTNS_WEEKLY;
  if (cadence === 'monthly') return PERIOD_BTNS_MONTHLY;
  return PERIOD_BTNS_DAILY;
}
function _buildPeriodBtns(totalPts, id, handlerName, cadence, hintDays) {
  const btnSet = _getPeriodBtnSet(cadence);
  const isActive = (i) => i === 0 ? totalPts >= btnSet[i].days : totalPts > btnSet[i-1].days;
  const avail = btnSet.filter((p, i) => isActive(i));
  let initDays;
  if (hintDays != null) {
    // 쿼리 의도 기간: 활성 버튼 중 hintDays 이하 최대값
    const matches = avail.filter(p => p.days <= hintDays);
    initDays = matches.length ? Math.max(...matches.map(p => p.days))
                              : (avail.length ? avail[0].days : totalPts);
  } else {
    // 의도 없음: 최소 활성 버튼
    initDays = avail.length ? avail[0].days : totalPts;
  }
  const html = btnSet.map((p, i) => {
    const dis = !isActive(i) ? ' disabled' : '';
    const act = p.days === initDays ? ' active' : '';
    return `<button class="sp-btn${act}" data-days="${p.days}" onclick="${handlerName}('${id}',${p.days})"${dis}>${p.label}</button>`;
  }).join('');
  return {initDays, html};
}

function _sliceChart(chart, days) {
  const allPts = chart.points;          // 전체 히스토리 (chartStore에 보존)
  const pts = allPts.slice(-days);
  // 비교선: 선택된 days마다 동적 계산 — daily는 7의 배수로 정렬해 요일 매칭
  let prev = null;
  const cadence = chart.cadence || 'daily';
  const prevEnd = allPts.length - days; // 현재 창 시작 인덱스
  if (prevEnd > 0) {
    const alignedDays = cadence === 'daily'
      ? Math.max(7, Math.round(days / 7) * 7)
      : days;
    const prevSlice = allPts.slice(Math.max(0, prevEnd - alignedDays), prevEnd);
    if (prevSlice.length >= 2) prev = prevSlice;
  }
  const vals = pts.map(p => p.value);
  const first = vals[0], last = vals[vals.length-1];
  const chg = first ? Math.round((last-first)/first*1000)/10 : null;
  return { ...chart, points: pts, points_prev: prev,
    summary: { min: Math.min(...vals), max: Math.max(...vals),
      avg: Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10, latest: last, change_pct: chg } };
}
function _spSetPeriod(id, days) {
  const chart = _chartStore[id], el = document.getElementById(id);
  if (!chart || !el) return;
  el.querySelector('.sp-body').innerHTML = _renderSparklineSVG(_sliceChart(chart, days));
  el.querySelectorAll('.sp-btn').forEach(b => b.classList.toggle('active', +b.dataset.days === days));
}
function _msSetPeriod(id, days) {
  const chart = _chartStore[id], el = document.getElementById(id);
  if (!chart || !el) return;
  const sliced = {...chart, series: chart.series.map(s=>({...s, points: s.points.slice(-days)}))};
  el.querySelector('.sp-body').innerHTML = _renderMultiSVG(sliced);
  el.querySelectorAll('.sp-btn').forEach(b => b.classList.toggle('active', +b.dataset.days === days));
}
function _dsSetPeriod(id, days) {
  const chart = _chartStore[id], el = document.getElementById(id);
  if (!chart || !el) return;
  const sliced = {...chart, series: chart.series.map(s=>({...s, points: s.points.slice(-days)}))};
  el.querySelector('.sp-body').innerHTML = _renderDualSVG(sliced);
  el.querySelectorAll('.sp-btn').forEach(b => b.classList.toggle('active', +b.dataset.days === days));
}

// ────────────────────────────────────────────────
// SVG CHART RENDERERS
// ────────────────────────────────────────────────
function _chartFs()     { return window.innerWidth < 600 ? '24px' : '15px'; } // SVG 축 라벨·값
function _chartFsMeta() { return window.innerWidth < 600 ? '15px' : '15px'; } // HTML legend·평균
function _chartFsSm()   { return window.innerWidth < 600 ? '15px' : '15px'; } // HTML 보조 텍스트

function _xLabels(pts, W, padX, H, xStep) {
  const fs = _chartFs();
  if (pts.length <= 10) {
    return pts.map((p,i) => {
      const dow = _DAYS_KO[new Date(p.date).getDay()];
      return `<text x="${(padX+i*xStep).toFixed(1)}" y="${H+14}" text-anchor="middle" fill="var(--dim)" style="font-size:${fs}">${p.date.slice(5)}(${dow})</text>`;
    }).join('');
  } else if (pts.length <= 20) {
    return pts.map((p,i) => i%2!==0 ? '' :
      `<text x="${(padX+i*xStep).toFixed(1)}" y="${H+14}" text-anchor="middle" fill="var(--dim)" style="font-size:${fs}">${p.date.slice(5)}</text>`
    ).join('');
  }
  return pts.map((p,i) => new Date(p.date).getDay()!==1 ? '' :
    `<text x="${(padX+i*xStep).toFixed(1)}" y="${H+14}" text-anchor="middle" fill="var(--dim)" style="font-size:${fs}">${p.date.slice(5)}</text>`
  ).join('');
}

function _renderSparklineSVG(chart) {
  const pts = chart.points;
  const W = 600, H = 390, padX = 10, padY = 18;
  const isRate = chart.unit === '%';
  const fmtVal = v => isRate ? `${v.toFixed(1)}%` : v.toLocaleString();
  const values = pts.map(p => p.value);
  const prevPts = chart.points_prev || [];
  const hasPrev = prevPts.length >= 2;
  const allVals = hasPrev ? [...values, ...prevPts.map(p=>p.value)] : values;
  const minV = Math.min(...allVals), maxV = Math.max(...allVals), rangeV = maxV-minV||1;
  const xStep = (W-padX*2) / Math.max(pts.length-1, 1);
  const coords = pts.map((p,i) => ({
    x: padX+i*xStep,
    y: padY+((maxV-p.value)/rangeV)*(H-padY*2),
    date: p.date, value: p.value,
  }));
  const currMinV = Math.min(...values), currMaxV = Math.max(...values);
  const maxIdx = values.indexOf(currMaxV), minIdx = values.indexOf(currMinV);
  const polyline = coords.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const area = polyline + ` ${coords[coords.length-1].x.toFixed(1)},${H} ${coords[0].x.toFixed(1)},${H}`;
  const showDots = pts.length <= 20;
  const dots = coords.map((c,i) => {
    const isMx=i===maxIdx, isMn=i===minIdx, isLast=i===coords.length-1;
    const r = (isMx||isMn||isLast) ? 4 : showDots ? 2.5 : 0;
    const fill = isMx?'#1d9e75':isMn?'#e24b4a':'#185fa5';
    if (!r) return '';
    return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r}" fill="${fill}"><title>${c.date}: ${fmtVal(c.value)}</title></circle>`;
  }).join('');
  const ls = `font-size:${_chartFs()};font-family:var(--mono)`;
  const maxC=coords[maxIdx], minC=coords[minIdx];
  const mxLx=Math.min(Math.max(maxC.x,18),W-18), mnLx=Math.min(Math.max(minC.x,18),W-18);
  const maxLabel=`<text x="${mxLx.toFixed(1)}" y="${(maxC.y-6).toFixed(1)}" text-anchor="middle" fill="#1d9e75" style="${ls}">${fmtVal(currMaxV)}</text>`;
  const minLabel=`<text x="${mnLx.toFixed(1)}" y="${(minC.y+13).toFixed(1)}" text-anchor="middle" fill="#e24b4a" style="${ls}">${fmtVal(currMinV)}</text>`;
  const avgV = values.reduce((a,b)=>a+b,0)/values.length;
  const avgY = padY+((maxV-avgV)/rangeV)*(H-padY*2);
  const avgLine = `<line x1="${padX}" y1="${avgY.toFixed(1)}" x2="${W-padX}" y2="${avgY.toFixed(1)}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>`;
  let prevHTML = '';
  if (hasPrev) {
    // slice(0, pts.length): 시작점 기준 정렬 — prev[0]과 pts[0]이 같은 요일
    const pa = prevPts.slice(0, pts.length);
    const pc = pa.map((p,i)=>({x:padX+i*xStep, y:padY+((maxV-p.value)/rangeV)*(H-padY*2)}));
    prevHTML = `<polyline points="${pc.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ')}" fill="none" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.55"/>`;
  }
  const summary = chart.summary || {};
  const changeTxt = summary.change_pct!=null
    ? `<span style="color:${summary.change_pct>=0?'#1d9e75':'#e24b4a'};font-weight:600;">${summary.change_pct>=0?'+':''}${summary.change_pct}%</span>` : '';
  const avgTxt = `<span style="color:var(--sub);font-size:${_chartFsMeta()};">평균 ${fmtVal(Math.round(avgV*10)/10)}</span>`;
  const prevLeg = hasPrev ? `<span style="color:var(--dim);font-size:${_chartFsSm()};margin-left:8px;">— 이번 / - - 전기간</span>` : '';
  return `<div class="ai-chart-meta">
    <span>${escapeHtml(chart.title||chart.metric||'')} · ${pts[0].date} ~ ${pts[pts.length-1].date}</span>
    <span>${avgTxt} ${changeTxt}${prevLeg}</span>
  </div>
  <svg viewBox="0 0 ${W} ${H+22}" style="width:100%;overflow:visible;display:block;">
    <polygon points="${area}" fill="#185fa5" opacity="0.08"/>
    ${prevHTML}
    <polyline points="${polyline}" fill="none" stroke="#185fa5" stroke-width="2"/>
    ${avgLine}${maxLabel}${minLabel}${dots}
    ${_xLabels(pts, W, padX, H, xStep)}
  </svg>`;
}

function renderSparkline(chart) {
  const id = 'sp'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  _chartStore[id] = chart;
  const totalPts = chart.points.length;
  const {initDays, html: btnHtml} = _buildPeriodBtns(totalPts, id, '_spSetPeriod', chart.cadence, chart.initial_days);
  const sliced = initDays < totalPts ? _sliceChart(chart, initDays) : chart;
  return `<div class="ai-chart-box" id="${id}">
    <div class="sp-period-btns">${btnHtml}</div>
    <div class="sp-body">${_renderSparklineSVG(sliced)}</div>
  </div>`;
}

function _renderMultiSVG(chart) {
  const series = chart.series || [];
  const W=600, H=390, padX=50, padR=10, padY=18;
  const fs=_chartFs();
  const isRate = chart.unit==='%';
  const fmtVal = v => isRate ? `${v.toFixed(1)}%` : v.toLocaleString();
  const COLORS = ['#185fa5','#1d9e75','#d97706','#dc2626','#7c3aed'];
  const allVals = series.flatMap(s=>s.points.map(p=>p.value));
  const minV=Math.min(...allVals),maxV=Math.max(...allVals),rangeV=maxV-minV||1;
  const refPts = series[0].points;
  const plotW = W - padX - padR;
  const yBottom = H - padY;
  const xStep = plotW / Math.max(refPts.length-1, 1);
  const GRID_N = 4;
  const _rndStep = isRate ? 10 : (rangeV>=1000000?100000 : rangeV>=100000?10000 : rangeV>=10000?1000 : rangeV>=1000?100 : rangeV>=100?10 : 1);
  const _fmtAxis = v => {
    const r = Math.round(v / _rndStep) * _rndStep;
    if (isRate) return `${r}%`;
    if (Math.abs(r)>=1000000) return `${+(r/1000000).toFixed(1)}M`;
    if (Math.abs(r)>=10000)   return `${Math.round(r/1000)}K`;
    if (Math.abs(r)>=1000)    return `${+(r/1000).toFixed(1)}K`;
    return `${r}`;
  };
  const gridSvg = Array.from({length: GRID_N}, (_,i) => {
    const frac = i / (GRID_N - 1);
    const gy = (padY + frac * (H - padY*2)).toFixed(1);
    const gv = maxV - frac * rangeV;
    return `<line x1="${padX}" y1="${gy}" x2="${padX+plotW}" y2="${gy}" stroke="var(--dim)" stroke-width="0.5" opacity="0.2"/>
      <text x="${padX-5}" y="${(+gy+4).toFixed(1)}" text-anchor="end" fill="var(--dim)" style="font-size:${_chartFs()};font-family:var(--mono)">${_fmtAxis(gv)}</text>`;
  }).join('');
  const axesSvg = `<line x1="${padX}" y1="${padY}" x2="${padX}" y2="${yBottom}" stroke="var(--dim)" stroke-width="1" opacity="0.4"/>
    <line x1="${padX}" y1="${yBottom}" x2="${padX+plotW}" y2="${yBottom}" stroke="var(--dim)" stroke-width="1" opacity="0.4"/>`;
  const seriesLines = series.map((s,si) => {
    const color = s.color||COLORS[si%COLORS.length];
    const sXs = plotW / Math.max(s.points.length-1, 1);
    const sc = s.points.map((p,i)=>({x:padX+i*sXs,y:padY+((maxV-p.value)/rangeV)*(H-padY*2),date:p.date,value:p.value}));
    const pl = sc.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
    const lc = sc[sc.length-1];
    return `<polyline points="${pl}" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="${lc.x.toFixed(1)}" cy="${lc.y.toFixed(1)}" r="3.5" fill="${color}"><title>${escapeHtml(s.label)} ${lc.date}: ${fmtVal(lc.value)}</title></circle>
      <text x="${(lc.x-6).toFixed(1)}" y="${(lc.y-6).toFixed(1)}" text-anchor="end" fill="${color}" style="font-size:${fs};font-family:var(--mono)">${fmtVal(lc.value)}</text>`;
  }).join('');
  const legend = series.map((s,si) => {
    const color=s.color||COLORS[si%COLORS.length];
    const latest=s.points[s.points.length-1]?.value;
    return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;">
      <svg width="16" height="2" viewBox="0 0 16 2" style="vertical-align:middle;"><line x1="0" y1="1" x2="16" y2="1" stroke="${color}" stroke-width="2"/></svg>
      <span style="font-size:${_chartFsMeta()};color:var(--sub)">${escapeHtml(s.label)}${latest!=null?' '+fmtVal(latest):''}</span></span>`;
  }).join('');
  return `<div class="ai-chart-meta">
    <span>${escapeHtml(chart.title||'')} · ${refPts[0]?.date} ~ ${refPts[refPts.length-1]?.date}</span>

  </div>
  <svg viewBox="0 0 ${W} ${H+22}" style="width:100%;overflow:visible;display:block;">

function renderMultiSparkline(chart) {
  const series = chart.series||[];
  if (series.length < 2) return '';
  const id = 'ms'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  _chartStore[id] = chart;
  const totalPts = series[0].points.length;
  const {initDays, html: btnHtml} = _buildPeriodBtns(totalPts, id, '_msSetPeriod', chart.cadence, chart.initial_days);
  const sliced = initDays < totalPts ? {...chart, series: chart.series.map(s=>({...s,points:s.points.slice(-initDays)}))} : chart;
  return `<div class="ai-chart-box" id="${id}">
    <div class="sp-period-btns">${btnHtml}</div>
    <div class="sp-body">${_renderMultiSVG(sliced)}</div>
  </div>`;
}

function _renderDualSVG(chart) {
  const series = chart.series||[];
  if (series.length < 2) return '';
  const fs=_chartFs();
  const W=600,H=390,padX=10,padY=18;
  const COLORS=['#185fa5','#1d9e75','#d97706'];
  const units = series.map(s=>s.unit||'');
  const sameUnit = units.every(u=>u===units[0]);
  const allVals = sameUnit ? series.flatMap(s=>s.points.map(p=>p.value)) : [];
  const gMin=sameUnit?Math.min(...allVals):0, gMax=sameUnit?Math.max(...allVals):0, gRange=gMax-gMin||1;
  const seriesLines = series.map((s,si) => {
    const color=s.color||COLORS[si%COLORS.length], unit=s.unit||'';
    const fmtV = v => unit==='%' ? `${v.toFixed(1)}%` : v.toLocaleString();
    const vals = s.points.map(p=>p.value);
    const sMin=sameUnit?gMin:Math.min(...vals), sMax=sameUnit?gMax:Math.max(...vals), sRange=sameUnit?gRange:(sMax-sMin||1);
    const sXs = (W-padX*2)/Math.max(s.points.length-1,1);
    const sc = s.points.map((p,i)=>({x:padX+i*sXs,y:padY+((sMax-p.value)/sRange)*(H-padY*2),date:p.date,value:p.value}));
    const pl = sc.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
    const lc = sc[sc.length-1];
    let sideLabels = '';
    if (!sameUnit && series.length===2) {
      const smx=Math.max(...vals), smn=Math.min(...vals);
      const mxC=sc[vals.indexOf(smx)], mnC=sc[vals.indexOf(smn)];
      const anchor=si===0?'start':'end', lx=si===0?padX+2:W-padX-2;
      sideLabels=`<text x="${lx}" y="${(mxC.y-3).toFixed(1)}" text-anchor="${anchor}" fill="${color}" style="font-size:${fs};font-family:var(--mono)">${fmtV(smx)}</text>
        <text x="${lx}" y="${(mnC.y+10).toFixed(1)}" text-anchor="${anchor}" fill="${color}" style="font-size:${fs};font-family:var(--mono)">${fmtV(smn)}</text>`;
    }
    const fillEl = si===0 ? `<polygon points="${pl} ${sc[sc.length-1].x.toFixed(1)},${H} ${sc[0].x.toFixed(1)},${H}" fill="${color}" opacity="0.06"/>` : '';
    return `${fillEl}<polyline points="${pl}" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="${lc.x.toFixed(1)}" cy="${lc.y.toFixed(1)}" r="3.5" fill="${color}"><title>${escapeHtml(s.label)} ${lc.date}: ${fmtV(lc.value)}</title></circle>${sideLabels}`;
  }).join('');
  const refPts=series[0].points, xStep=(W-padX*2)/Math.max(refPts.length-1,1);
  const legend = series.map((s,si) => {
    const color=s.color||COLORS[si%COLORS.length], unit=s.unit||'';
    const fmtV=v=>unit==='%'?`${v.toFixed(1)}%`:v.toLocaleString();
    const latest=s.points[s.points.length-1]?.value;
    return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;">
      <svg width="16" height="2" viewBox="0 0 16 2" style="vertical-align:middle;"><line x1="0" y1="1" x2="16" y2="1" stroke="${color}" stroke-width="2"/></svg>
      <span style="font-size:${_chartFsMeta()};color:var(--sub)">${escapeHtml(s.label)}${latest!=null?' '+fmtV(latest):''}</span></span>`;
  }).join('');
  const scaleNote = sameUnit
    ? `<div style="font-size:${_chartFsSm()};color:var(--dim);margin-bottom:2px;">※ 공통 척도 (${escapeHtml(units[0])})</div>`
    : series.length===2
      ? `<div style="font-size:${_chartFsSm()};color:var(--dim);margin-bottom:2px;">※ 각 지표 독립 척도 (좌: ${escapeHtml(series[0]?.label||'')} / 우: ${escapeHtml(series[1]?.label||'')})</div>`
      : `<div style="font-size:${_chartFsSm()};color:var(--dim);margin-bottom:2px;">※ 각 지표 독립 척도</div>`;
  return `<div class="ai-chart-meta">
    <span>${escapeHtml(chart.title||'')} · ${refPts[0]?.date} ~ ${refPts[refPts.length-1]?.date}</span>
    <span>${legend}</span>
  </div>${scaleNote}
  <svg viewBox="0 0 ${W} ${H+22}" style="width:100%;overflow:visible;display:block;">
    ${seriesLines}${_xLabels(refPts,W,padX,H,xStep)}
  </svg>`;
}

function renderDualSparkline(chart) {
  const series=chart.series||[];
  if (series.length < 2) return '';
  const id='ds'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  _chartStore[id]=chart;

    <div class="sp-period-btns">${btnHtml}</div>

function renderBarChart(chart) {
  const items=chart.items, maxV=Math.max(...items.map(i=>i.value))||1;
  const colors=['#185fa5','#1d9e75','#d97706','#dc2626','#7c3aed'];
  const bars=items.map((it,idx)=>{
    const h=Math.max((it.value/maxV)*72,6);
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;">
      <span style="font-size:${_chartFsMeta()};font-weight:600;font-family:var(--mono);color:var(--text);">${it.value.toLocaleString()}</span>
      <div style="width:80%;height:${h.toFixed(1)}px;background:${colors[idx%colors.length]};border-radius:3px 3px 0 0;"></div>
      <span style="font-size:${_chartFsMeta()};color:var(--sub);text-align:center;word-break:keep-all;line-height:1.3;">${escapeHtml(it.label)}</span>
    </div>`;
  }).join('');
  return `<div class="ai-chart-box">
    <div class="ai-chart-meta"><span>${escapeHtml(chart.title||'')}${chart.date?' · '+chart.date:''}</span><span>자동 시각화</span></div>
    <div style="display:flex;align-items:flex-end;gap:8px;min-height:88px;">${bars}</div>
  </div>`;
}

function renderRankingTable(chart) {
  const rows=chart.rows||[];
  if (!rows.length) return '';
  const sm=chart.sort_metric||'dau';
  const _D='<span style="color:var(--dim)">—</span>';
  const fmtNum=v=>v!=null?v.toLocaleString():_D;
  const fmtRate=v=>v!=null?`${v.toFixed(1)}%`:_D;
  const fmtPct=v=>v==null?_D:`<span class="${v>=0?'rk-pos':'rk-neg'}">${v>=0?'+':''}${v.toFixed(1)}%</span>`;
  const fmtDiff=v=>v==null?_D:`<span class="${v>=0?'rk-pos':'rk-neg'}">${v>=0?'+':''}${v.toFixed(1)}pp</span>`;
  const FMTS={num:fmtNum,pct:fmtPct,rate:fmtRate,diff:fmtDiff,share:fmtRate};
  const SPECS={
    dau:{c:[['dau','DAU','num'],['dau_wow','WoW(7일전)','pct'],['real_rate','실청취율','rate']]},
    wau:{c:[['wau','WAU','num'],['dau_week_wow','WoW(전주)','pct'],['real_rate_week','실청취율','rate']]},
    mau:{c:[['mau','MAU','num'],['dau_mon_wow','WoW(전월)','pct'],['real_rate_mon','실청취율','rate']]},
    new:{c:[['new','신규(일)','num'],['new_wow','전일대비','pct'],['new_pct','DAU비중','share']]},
    new_week:{c:[['new_week','신규(주)','num'],['new_week_wow','전주대비','pct'],['new_week_pct','WAU비중','share']]},
    react:{c:[['react','복귀(일)','num'],['react_wow','전일대비','pct'],['react_pct','DAU비중','share']]},
    react_rate:{c:[['react_rate','복귀율(일)','rate'],['react_rate_diff','전일대비','diff']]},
    churn_rate:{c:[['churn_rate','이탈율(일)','rate'],['churn_rate_diff','전일대비','diff']]},
    churn_rate_week:{c:[['churn_rate_week','이탈율(주)','rate'],['churn_rate_week_diff','전주대비','diff']]},
    deep_rate:{c:[['deep_rate','깊은청취율(일)','rate'],['deep_rate_diff','전일대비','diff']]},
    deep_rate_week:{c:[['deep_rate_week','깊은청취율(주)','rate'],['deep_rate_week_diff','전주대비','diff']]},
    engage_rate:{c:[['engage_rate','참여율(일)','rate'],['engage_rate_diff','전일대비','diff']]},
    engage_rate_week:{c:[['engage_rate_week','참여율(주)','rate'],['engage_rate_week_diff','전주대비','diff']]},
    d1_ret:{c:[['d1_ret','D1유지(전체)','rate'],['d1_ret_diff','전기대비','diff']]},
    d7_ret:{c:[['d7_ret','D7유지(전체)','rate'],['d7_ret_diff','전기대비','diff']]},
    w1_ret:{c:[['w1_ret','W1유지(전체)','rate'],['w1_ret_diff','전기대비','diff']]},
    m1_ret:{c:[['m1_ret','M1유지(전체)','rate'],['m1_ret_diff','전기대비','diff']]},
    new_d1_ret:{c:[['new_d1_ret','D1유지(신규)','rate'],['new_d1_ret_diff','전기대비','diff']]},
    new_d7_ret:{c:[['new_d7_ret','D7유지(신규)','rate'],['new_d7_ret_diff','전기대비','diff']]},
    new_w1_ret:{c:[['new_w1_ret','W1유지(신규)','rate'],['new_w1_ret_diff','전기대비','diff']]},
    new_m1_ret:{c:[['new_m1_ret','M1유지(신규)','rate'],['new_m1_ret_diff','전기대비','diff']]},
  };
  const cols=(SPECS[sm]||SPECS.dau).c;
  const DEFAULT_N=10, startExp=chart.show_all||rows.length<=DEFAULT_N, hasMore=rows.length>DEFAULT_N;
  const _WE=new Set(['M05','M07','M10','M11']);
  const tbody=rows.map((r,i)=>{
    const hidden=!startExp&&i>=DEFAULT_N;
    const tds=cols.map(([f,,fmt])=>`<td class="rk-v">${FMTS[fmt](r[f])}</td>`).join('');
    const wb=_WE.has(r.code)?'<span class="pr-badge weekend">주말</span>':'';

    ${toggleBtn}
  </div>`;

function toggleRankingRows(btn, defaultN) {
  const tbody=btn.closest('.ai-chart-box').querySelector('tbody');
  const rows=tbody.querySelectorAll('tr');
  const isExp=[...rows].every(r=>!r.classList.contains('rk-hidden'))&&rows.length>defaultN;
  if (isExp) {
    rows.forEach((r,i)=>{ if(i>=defaultN) r.classList.add('rk-hidden'); });
    btn.textContent=`▼ 전체 보기 (${rows.length}개)`;
  } else {
    rows.forEach(r=>r.classList.remove('rk-hidden'));
    btn.textContent='▲ 접기';
  }
}

function renderOverviewTable(chart) {
  const rows=chart.rows||[];
  if (!rows.length) return '';
  const _D='<span style="color:var(--dim)">—</span>';
  const fmtN=v=>v!=null?v.toLocaleString():_D;
  const fmtR=v=>v!=null?`${v.toFixed(1)}%`:_D;
  const fmtW=v=>v==null?_D:`<span class="${v>=0?'rk-pos':'rk-neg'}">${v>=0?'+':''}${v.toFixed(1)}%</span>`;
  const COLS=[
    ['dau','DAU(일)','n','규모'],['wau','WAU(주)','n','규모'],['mau','MAU(월)','n','규모'],
    ['dau_r7','롤링WAU','n','규모'],['dau_wow','WoW(7일)','w','규모'],
    ['dau_week_wow','WoW(전주)','w','규모'],['dau_mon_wow','WoW(전월)','w','규모'],
    ['new','신규(일)','n','신규'],['new_week','신규(주)','n','신규'],['new_mon','신규(월)','n','신규'],
    ['react','복귀(일)','n','복귀'],['react_week','복귀(주)','n','복귀'],['react_mon','복귀(월)','n','복귀'],
    ['react_rate','복귀율(일)','r','복귀율'],['react_rate_week','복귀율(주)','r','복귀율'],['react_rate_mon','복귀율(월)','r','복귀율'],
    ['churn_rate','이탈율(일)','r','이탈'],['churn_rate_week','이탈율(주)','r','이탈'],['churn_rate_mon','이탈율(월)','r','이탈'],
    ['real_rate','실청취(일)','r','실청취'],['real_rate_week','실청취(주)','r','실청취'],['real_rate_mon','실청취(월)','r','실청취'],
    ['deep_rate','깊은청취(일)','r','깊은청취'],['deep_rate_week','깊은청취(주)','r','깊은청취'],['deep_rate_mon','깊은청취(월)','r','깊은청취'],
    ['engage_rate','참여율(일)','r','참여'],['engage_rate_week','참여율(주)','r','참여'],['engage_rate_mon','참여율(월)','r','참여'],
    ['habit_rate','습관(일)','r','습관'],['habit_rate_week','습관(주)','r','습관'],['habit_rate_mon','습관(월)','r','습관'],
    ['d1_ret','D1유지','r','유지율(전체)'],['d7_ret','D7유지','r','유지율(전체)'],['w1_ret','W1유지','r','유지율(전체)'],['m1_ret','M1유지','r','유지율(전체)'],
    ['new_d1_ret','D1유지','r','유지율(신규)'],['new_d7_ret','D7유지','r','유지율(신규)'],['new_w1_ret','W1유지','r','유지율(신규)'],['new_m1_ret','M1유지','r','유지율(신규)'],
  ];
  const FMTS={n:fmtN,r:fmtR,w:fmtW};
  const activeCols=chart.columns?COLS.filter(([f])=>chart.columns.includes(f)):COLS;
  const groups=[];let cg=null,cs=0;
  for(const[,,,g]of activeCols){if(g===cg){cs++;}else{if(cg)groups.push([cg,cs]);cg=g;cs=1;}}
  if(cg)groups.push([cg,cs]);
  const _WE=new Set(['M05','M07','M10','M11']);
  const _CH={'파워FM':'rgba(239,68,68,.06)','러브FM':'rgba(132,204,22,.06)'};
  const groupRow=`<tr class="ov-group-row"><th colspan="2" style="position:sticky;left:0;z-index:3;background:var(--bg2)"></th>${groups.map(([g,span])=>`<th colspan="${span}" class="ov-group-th">${g}</th>`).join('')}</tr>`;
  const headerRow=`<tr><th class="ov-sticky ov-th-no">편성순</th><th class="ov-sticky2 ov-th-name">프로그램</th>${activeCols.map(([,h])=>`<th class="ov-th">${h}</th>`).join('')}</tr>`;
  const bodyRows=rows.map((r,i)=>{
    const wb=_WE.has(r.code)?'<span class="pr-badge weekend">주말</span>':'';
    const bg=_CH[r.channel]||'';
    const tds=activeCols.map(([f,,fmt])=>`<td class="ov-v">${FMTS[fmt](r[f])}</td>`).join('');
    return `<tr${bg?` style="background:${bg}"`:''}><td class="ov-sticky ov-no">${i+1}</td><td class="ov-sticky2 ov-name">${escapeHtml(r.name)}${wb}</td>${tds}</tr>`;
  }).join('');
  return `<div class="ai-chart-box ov-wrap">
    <div class="ai-chart-meta"><span>${escapeHtml(chart.title||'')}</span><span>자동 시각화</span></div>
    <div class="ov-scroll"><table class="ov-table"><thead>${groupRow}${headerRow}</thead><tbody>${bodyRows}</tbody></table></div>
  </div>`;
}

let _msgCount = 0;

function _hideWelcome() {
  const w = document.getElementById('welcomeScreen');
  if (w) w.style.display = 'none';
}

function addUserMsg(text) {
  _hideWelcome();
  const id = 'msg-'+(++_msgCount);
  document.getElementById('threadInner').insertAdjacentHTML('beforeend', `
    <div class="msg msg-user" id="${id}">
      <div class="msg-avatar">나</div>
      <div class="msg-body"><div class="msg-user-text">${escapeHtml(text)}</div></div>
    </div>`);
  _scrollBottom();
  return id;
}

function addAiTyping() {
  const id = 'msg-'+(++_msgCount);
  document.getElementById('threadInner').insertAdjacentHTML('beforeend', `
    <div class="msg msg-ai" id="${id}">
      <div class="msg-avatar">R</div>
      <div class="msg-body">
        <div class="msg-ai-name">RAAS Assistant</div>
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>`);
  _scrollBottom();
  return id;
}

function _buildChartHTML(chart) {
  if (!chart) return '';
  let h = '';
  if (chart.type==='timeseries' && chart.points?.length>=2) h=renderSparkline(chart);
  else if (chart.type==='timeseries_multi' && chart.series?.length>=2) h=renderMultiSparkline(chart);
  else if (chart.type==='timeseries_dual' && chart.series?.length>=2) h=renderDualSparkline(chart);
  else if (chart.type==='comparison' && chart.items?.length>=2) h=renderBarChart(chart);
  else if (chart.type==='table' && chart.subtype==='overview' && chart.rows?.length) h=renderOverviewTable(chart);
  else if (chart.type==='table' && chart.rows?.length) h=renderRankingTable(chart);
  const src = chart.source
    ? `<p class="ai-source">출처: ${escapeHtml(chart.source)}${chart.points?' · '+chart.points.length+'개 포인트':''}${chart.items?' · '+chart.items.length+'개 항목':''}</p>`
    : '';
  return h + src;
}

function fillAiMsg(id, data) {
  const el = document.getElementById(id);
  if (!el) return;
  const answer = (data && data.answer) ? data.answer : '(답변 없음)';
  el.querySelector('.msg-body').innerHTML = `
    <div class="msg-ai-name">RAAS Assistant</div>
    <div class="msg-ai-text">${renderAiText(answer)}</div>
    ${_buildChartHTML(data?.chart_data)}`;
  _scrollBottom();
}

function fillAiError(id, errText) {
  const el = document.getElementById(id);
  if (!el) return;
  el.querySelector('.msg-body').innerHTML = `
    <div class="msg-ai-name">RAAS Assistant</div>
    <div class="msg-ai-text" style="color:var(--red);">오류: ${escapeHtml(errText)}</div>`;
}

function _scrollBottom() {
  const t = document.getElementById('chatThread');
  t.scrollTop = t.scrollHeight;
}

async function submitQuery(question) {
  question = question.trim();
  if (!question) return;
  const input = document.getElementById('chatInput');
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('btnSend').disabled = true;
  addUserMsg(question);
  const aiId = addAiTyping();
  const msgBody = document.getElementById(aiId).querySelector('.msg-body');

  try {
    const res = await fetch('/api/query/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-User-Id': RAAS_USER_ID },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    let rawText = '', chartData = null, initialized = false, streamDone = false;
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let ev;
        try { ev = JSON.parse(line.slice(6)); } catch(e) { continue; }
        if (ev.type === 'meta') {
          chartData = ev.chart_data;
        } else if (ev.type === 'token') {
          if (!initialized) {
            msgBody.innerHTML = `<div class="msg-ai-name">RAAS Assistant</div><div class="msg-ai-text" id="${aiId}-txt"></div>`;
            initialized = true;
          }
          rawText += ev.text;
          document.getElementById(`${aiId}-txt`).innerHTML = renderAiText(rawText);
          _scrollBottom();
        } else if (ev.type === 'done') {
          msgBody.innerHTML = `<div class="msg-ai-name">RAAS Assistant</div><div class="msg-ai-text">${renderAiText(rawText)}</div>${_buildChartHTML(chartData)}`;
          _saveCachedAnswer(question, msgBody.innerHTML);
          refreshHistory();
          _scrollBottom();
          streamDone = true;
          break;  // inner for loop 탈출 → 아래에서 while도 탈출
        } else if (ev.type === 'error') {
          msgBody.innerHTML = `<div class="msg-ai-name">RAAS Assistant</div><div class="msg-ai-text" style="color:var(--red);">오류: ${escapeHtml(ev.message)}</div>`;
          streamDone = true;
          break;
        }
      }
      if (streamDone) break;  // while loop 탈출
    }
    if (!initialized && !streamDone) fillAiError(aiId, '응답이 없습니다.');
  } catch (err) {
    fillAiError(aiId, err.message);
  } finally {
    document.getElementById('btnSend').disabled = false;
  }
}

// ────────────────────────────────────────────────
// HISTORY
// ────────────────────────────────────────────────
let _histItems = [];

function restoreFromCache(question, answerHTML) {
  const ti = document.getElementById('threadInner');
  ti.innerHTML = '';
  _msgCount = 0;
  ti.insertAdjacentHTML('beforeend', `
    <div class="msg msg-user" id="msg-${++_msgCount}">
      <div class="msg-avatar">나</div>
      <div class="msg-body"><div class="msg-user-text">${escapeHtml(question)}</div></div>
    </div>`);
  ti.insertAdjacentHTML('beforeend', `
    <div class="msg msg-ai" id="msg-${++_msgCount}">
      <div class="msg-avatar">R</div>
      <div class="msg-body">${answerHTML}</div>
    </div>`);
  _scrollBottom();
}

function _onHistoryClick(i) {
  const q = _histItems[i]?.question;
  if (!q) return;
  if (isMobile()) closeSidebar();
  const cached = _getCachedAnswer(q);
  if (cached) restoreFromCache(q, cached);
  else submitQuery(q);
}

async function refreshHistory() {
  const list = document.getElementById('historyList');
  try {
    const res = await fetch('/api/query/history?limit=50', { headers: { 'X-User-Id': RAAS_USER_ID } });
    const data = await res.json();
    if (!data.items?.length) {
      list.innerHTML = '<div class="history-empty">아직 질의 내역이 없습니다.</div>';
      return;
    }
    // 중복 질문 제거 — 서버는 최신순 반환이므로 처음 등장한 것(=가장 최근)만 유지
    const seen = new Set();
    const deduped = data.items.filter(it => {
      if (seen.has(it.question)) return false;
      seen.add(it.question);
      return true;
    });
    _histItems = deduped;
    list.innerHTML = deduped.map((it, i) => {
      const q = it.question;
      const display = q.length > 46 ? q.slice(0, 46) + '…' : q;
      const hasCached = !!_getCachedAnswer(q);
      const dot = hasCached ? '<span class="hist-cached" title="캐시된 답변"></span>' : '';
      return `<div class="history-item" onclick="_onHistoryClick(${i})">
        ${dot}<span class="history-item-q">${escapeHtml(display)}</span>
        <span class="hist-time">${formatRelTime(it.created_at)}</span>
      </div>`;
    }).join('');
  } catch (_) {
    list.innerHTML = '<div class="history-empty">히스토리 로드 실패</div>';
  }
}

// ────────────────────────────────────────────────
// KPI PANEL
// ────────────────────────────────────────────────
async function loadKpiPanel() {
  const scroll = document.getElementById('kpiScroll');
  scroll.innerHTML = '<div class="kpi-loading">로드 중…</div>';
  try {
    const res = await fetch('/api/briefing');
    const json = await res.json();
    if (!json.ok) {
      scroll.innerHTML = `<div class="kpi-loading">데이터 없음: ${escapeHtml(json.error||'')}</div>`;
      return;
    }
    const d = json.data;
    const s1 = d.s1_executive||{}, s7 = d.s7_anomalies||{}, s6 = d.s6_channels||{};
    const fn = v => v != null ? v.toLocaleString() : '—';
    const fw = (v, suf='%') => {
      if (v == null) return '';
      const cls = v > 0 ? 'up' : v < 0 ? 'dn' : 'flat';
      return `<div class="kpi-card-wow ${cls}">${v>=0?'+':''}${v.toFixed(1)}${suf}</div>`;
    };
    let html = `<div class="kpi-section">
      <div class="kpi-section-title">핵심 지표 · 일간</div>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-card-label">DAU</div><div class="kpi-card-value">${fn(s1.dau)}</div>${fw(s1.dau_wow)}</div>
        <div class="kpi-card"><div class="kpi-card-label">WAU</div><div class="kpi-card-value">${fn(s1.wau)}</div>${fw(s1.wau_chg)}</div>
        <div class="kpi-card"><div class="kpi-card-label">MAU</div><div class="kpi-card-value">${fn(s1.mau)}</div>${fw(s1.mau_chg)}</div>
        <div class="kpi-card"><div class="kpi-card-label">신규</div><div class="kpi-card-value">${fn(s1.new_user)}</div><div class="kpi-card-wow flat">${s1.new_pct!=null?s1.new_pct.toFixed(1)+'%':''}</div></div>
      </div>
    </div>`;

    const alerts = [
      ...(s7.alerts||[]).filter(a=>a.level==='RED').map(a=>[a,'red']),
      ...(s7.alerts||[]).filter(a=>a.level==='YELLOW').map(a=>[a,'yellow']),
      ...(s7.alerts||[]).filter(a=>a.level==='GREEN').slice(0,2).map(a=>[a,'green']),
    ];
    if (alerts.length) {
      html += `<div class="kpi-section"><div class="kpi-section-title">이상 알림</div>`;
      html += alerts.map(([a,cls])=>
        `<div class="alert-item ${cls}">
          <div class="alert-dot ${cls}"></div>
          <div class="alert-text">${escapeHtml(a.message||a.metric||'')}</div>
        </div>`).join('');
      html += '</div>';
    }

    const channels = s6.channels||[];
    if (channels.length) {
      html += `<div class="kpi-section"><div class="kpi-section-title">채널별 DAU</div><div class="channel-chips">`;
      html += channels.map(ch =>
        `<div class="channel-chip">${escapeHtml(ch.name||ch.code)}<strong>${fn(ch.dau)}</strong></div>`
      ).join('');
      html += '</div></div>';
    }

    scroll.innerHTML = html;
  } catch (err) {
    scroll.innerHTML = `<div class="kpi-loading">로드 실패: ${escapeHtml(err.message)}</div>`;
  }
}

document.getElementById('btnRefreshKpi').addEventListener('click', loadKpiPanel);

const SVG_SUN  = `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const SVG_MOON = `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function _applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('btnTheme');
  if (btn) btn.innerHTML = theme === 'dark' ? SVG_SUN : SVG_MOON;
  // iOS Safari는 setAttribute로 즉시 반영 안 됨 — 제거 후 재삽입으로 강제 재읽기
  const color = theme === 'dark' ? '#0d1117' : '#f0f2f5';
  let meta = document.getElementById('metaThemeColor');
  if (meta) meta.remove();
  meta = document.createElement('meta');
  meta.id = 'metaThemeColor';
  meta.name = 'theme-color';
  meta.content = color;
  document.head.appendChild(meta);
}

(function(){
  const saved = localStorage.getItem('raas_theme') || 'dark';
  _applyTheme(saved);
})();

document.getElementById('btnTheme').addEventListener('click', function(){
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('raas_theme', next);
  _applyTheme(next);
});
