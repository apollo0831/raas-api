<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAAS 공유 답변</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{--bg:#fbfcfd;--card:#fff;--text:#1a2230;--sub:#5b6675;--line:#e6e9ee;--accent:#2563eb;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.65;}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px;}
  .hd{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .hd .logo{font-weight:800;color:var(--accent);letter-spacing:.3px;}
  .hd .ttl{color:var(--sub);font-size:14px;}
  .hd .sub{color:var(--sub);font-size:12px;margin-left:auto;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:14px;font-weight:600;}
  .q .qlabel{color:var(--sub);font-size:12px;font-weight:500;margin-bottom:3px;}
  .a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;white-space:pre-wrap;word-break:break-word;}
  .a b{font-weight:700;}
  .story-table-scroll{overflow-x:auto;margin:10px 0;}
  table.story-table{border-collapse:collapse;width:100%;font-size:14px;}
  table.story-table th,table.story-table td{border:1px solid var(--line);padding:6px 10px;text-align:left;white-space:nowrap;}
  table.story-table th{background:#f1f4f8;font-weight:600;}
  .llm-chart-box{margin:12px 0;}
  .llm-chart{width:100%;height:280px;}
  .ai-echarts-fallback-note{color:var(--sub);font-size:13px;padding:20px;text-align:center;}
  .sl-meta-footer{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);}
  .story-small-note{color:var(--sub);font-size:12px;margin-top:4px;}
  .err{color:var(--sub);text-align:center;padding:60px 20px;}
  .foot{color:var(--sub);font-size:12px;text-align:center;margin-top:24px;}
</style>
</head><body>
<div class="wrap">
  <div class="hd"><span class="logo">RAAS</span><span class="ttl">공유된 답변</span><span class="sub" id="meta"></span></div>
  <div id="content"><div class="err">불러오는 중…</div></div>
  <div class="foot">Radio Analytics · 이 링크는 생성 후 24시간 뒤 만료됩니다.</div>
</div>
<script>
function escapeHtml(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const _store={}; let _seq=0;
// renderAiText — raas_web.js의 렌더러를 읽기전용용으로 축약(텍스트·표·굵게·[small]·차트)
function renderAiText(s){
  if(!s) return '';
  const charts=[];
  s=s.replace(/```chart\s*\n([\s\S]*?)\n```/g,(m,body)=>{
    let spec; try{spec=JSON.parse(body.trim());}catch(e){return '';}
    if(!spec||!Array.isArray(spec.x)||!Array.isArray(spec.series)) return '';
    const id='sc'+(_seq++); _store[id]={spec};
    charts.push(`<div class="llm-chart-box"><div class="llm-chart" id="${id}"></div></div>`);
    return `@@C${charts.length-1}@@\n`;
  });
  s=s.replace(/```chart[\s\S]*$/g,'');
  const tables=[];
  s=s.replace(/(\|[^\n]+\|\n\|[-:|\s]+\|\n(?:\|[^\n]+\|\n?)+)/g,(match)=>{
    const rows=match.trim().split('\n');
    const header=rows[0].split('|').slice(1,-1).map(c=>c.trim());
    const body=rows.slice(2).map(r=>r.split('|').slice(1,-1).map(c=>c.trim()));
    const thead='<tr>'+header.map(c=>`<th>${escapeHtml(c)}</th>`).join('')+'</tr>';
    const tbody=body.map(r=>'<tr>'+r.map(c=>`<td>${escapeHtml(c).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</td>`).join('')+'</tr>').join('');
    tables.push(`<div class="story-table-scroll"><table class="story-table">${thead}${tbody}</table></div>`);
    return `@@T${tables.length-1}@@\n`;
  });
  const meta=[];
  s=s.replace(/\[small\]([\s\S]+?)\[\/small\]/g,(_,b)=>{meta.push(b);return '';});
  let out=escapeHtml(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  out=out.replace(/^[ \t]*#{1,6}[ \t]+(.+)$/gm,'<b>$1</b>')
         .replace(/^[ \t]*([-*_])\1{2,}[ \t]*$/gm,'')
         .replace(/^[ \t]*&gt;[ \t]+/gm,'')
         .replace(/\n{3,}/g,'\n\n');
  out=out.replace(/@@T(\d+)@@\n?/g,(_,i)=>tables[+i]);
  out=out.replace(/@@C(\d+)@@\n?/g,(_,i)=>charts[+i]);
  if(meta.length){
    out=out.replace(/\s+$/,'');
    out+='<div class="sl-meta-footer">'+meta.map(b=>`<div class="story-small-note">${escapeHtml(b.trim()).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}</div>`).join('')+'</div>';
  }
  return out;
}
function chartOption(spec){
  const c={text:'#1a2230',sub:'#5b6675',line:'#e6e9ee',palette:['#2563eb','#e05353','#16a34a','#d97706','#7c3aed','#0891b2']};
  const type=(spec.type==='bar')?'bar':'line';
  const multi=(spec.series||[]).length>1;
  return {
    grid:{left:6,right:16,top:spec.title?34:14,bottom:6,containLabel:true},
    title:spec.title?{text:spec.title,left:0,textStyle:{color:c.text,fontSize:13,fontWeight:600}}:undefined,
    tooltip:{trigger:'axis'},
    legend:multi?{top:2,right:0,textStyle:{color:c.sub},itemWidth:14}:undefined,
    xAxis:{type:'category',data:spec.x,boundaryGap:type==='bar',axisLabel:{color:c.sub,fontSize:11},axisLine:{lineStyle:{color:c.line}}},
    yAxis:{type:'value',name:spec.unit||'',nameTextStyle:{color:c.sub},scale:(type==='line'),axisLabel:{color:c.sub,fontSize:11},splitLine:{lineStyle:{color:c.line}}},
    series:(spec.series||[]).map((sr,i)=>({name:sr.name,type,data:sr.data,smooth:type==='line',itemStyle:{color:c.palette[i%c.palette.length]},lineStyle:{width:2},symbol:'circle',symbolSize:4})),
  };
}
function mountCharts(){
  if(!window.echarts) return;
  document.querySelectorAll('.llm-chart').forEach(el=>{
    const e=_store[el.id]; if(!e||!e.spec) return;
    try{ const ch=echarts.init(el); ch.setOption(chartOption(e.spec));
      window.addEventListener('resize',()=>{try{ch.resize();}catch(_){}}); }
    catch(err){ el.innerHTML='<div class="ai-echarts-fallback-note">차트 렌더 실패</div>'; }
  });
}
(async ()=>{
  const token=(location.pathname.split('/s/')[1]||'').replace(/\/$/,'');
  const cont=document.getElementById('content');
  try{
    const r=await fetch('/api/share/'+encodeURIComponent(token),
      {headers:{'ngrok-skip-browser-warning':'true'}});   // ngrok 무료 경고 인터스티셜 우회
    const d=await r.json();
    if(!d.ok){ cont.innerHTML='<div class="err">'+escapeHtml(d.error||'불러올 수 없습니다')+'</div>'; return; }
    document.getElementById('meta').textContent=(d.created_at||'').slice(0,10);
    if(d.question) document.title = d.question.length>70 ? d.question.slice(0,70)+'…' : d.question;  // 탭 제목=질문
    cont.innerHTML='<div class="q"><div class="qlabel">질문</div>'+escapeHtml(d.question)+'</div>'
      +'<div class="a">'+renderAiText(d.answer)+'</div>';
    mountCharts();
  }catch(e){ cont.innerHTML='<div class="err">불러오는 중 오류가 발생했습니다.</div>'; }
})();
</script>
</body></html>
